name: architecture

on:
  push:
  pull_request:

jobs:
  layers:
    name: Направление зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка самой проверки (отрицательный случай)
        run: python3 scripts/check_layers.py --selftest

      - name: Слои и контексты
        run: python3 scripts/check_layers.py

      - name: Проверка самой сверки владения (отрицательный случай)
        run: python3 scripts/check_table_owners.py --selftest

      - name: Владение таблицами
        run: python3 scripts/check_table_owners.py

  core-without-userver:
    name: Домен собирается без userver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # userver в этом окружении не установлен намеренно: если pdr_core или
      # pdr_application от него зависят, шаг не соберётся.
      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      # pdr_application — интерфейсная цель (только порты-заголовки), собирать
      # в ней нечего. pdr_infrastructure — настоящая цель, линкует pdr_application
      # и pdr_core, поэтому её сборка компилирует и заголовки слоя application.
      - name: Сборка pdr_core и pdr_infrastructure
        run: cmake --build build --target pdr_core pdr_infrastructure --parallel

  tests:
    name: Тесты ядра и сценариев
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Сборка
        run: cmake --build build --parallel

      # Среди тестов есть такие, которые ОБЯЗАНЫ не собираться: они собирают
      # свою цель сами и ждут провала компилятора.
      - name: ctest
        run: ctest --test-dir build --output-on-failure
