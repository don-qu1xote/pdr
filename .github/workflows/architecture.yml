name: architecture

on:
  push:
  pull_request:

jobs:
  layers:
    name: Направление зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка самой проверки (отрицательный случай)
        run: python3 scripts/check_layers.py --selftest

      - name: Слои и контексты
        run: python3 scripts/check_layers.py

      - name: Проверка самой сверки владения (отрицательный случай)
        run: python3 scripts/check_table_owners.py --selftest

      - name: Владение таблицами
        run: python3 scripts/check_table_owners.py

  core-without-userver:
    name: Домен собирается без userver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # userver в этом окружении не установлен намеренно: если pdr_core или
      # pdr_application от него зависят, шаг не соберётся.
      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      # pdr_application — интерфейсная цель (только порты-заголовки), собирать
      # в ней нечего. pdr_infrastructure — настоящая цель, линкует pdr_application
      # и pdr_core, поэтому её сборка компилирует и заголовки слоя application.
      - name: Сборка pdr_core и pdr_infrastructure
        run: cmake --build build --target pdr_core pdr_infrastructure --parallel

  env-parity:
    name: Профили окружения не разъехались
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker compose на раннере уже есть; демон для `config` не нужен —
      # конфигурация только отрисовывается.
      - name: Проверка самой сверки профилей (отрицательный случай)
        run: python3 scripts/verify_env_parity.py --selftest

      - name: Сверка профилей
        run: python3 scripts/verify_env_parity.py

  migrations:
    name: Миграции и документ схемы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка самого линтера миграций (отрицательный случай)
        run: python3 scripts/check_migrations.py --selftest

      - name: Правила колонок
        run: python3 scripts/check_migrations.py

      # Документ схемы собирается из миграций; расхождение означает, что его
      # правили руками или забыли пересобрать.
      - name: Документ схемы свежий
        run: python3 scripts/gen_schema_doc.py --check

  local-install:
    name: Установка поднимается, миграции применяются
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тем же единственным compose, что и на машине разработчика, — профилем ci.
      - name: Профиль ci
        run: cp deploy/env/ci.env.example deploy/env/ci.env

      - name: Поднять и применить
        run: make up ENV_PROFILE=ci

      # Второй прогон обязан ничего не применять: повтор идемпотентен.
      - name: Повтор ничего не меняет
        run: |
          make migrate ENV_PROFILE=ci | tee /tmp/second-run.log
          grep -q "Применять нечего" /tmp/second-run.log

      - name: Сверка сумм
        run: make migrate-verify ENV_PROFILE=ci

      - name: Погасить вместе с томами
        if: always()
        run: make down ENV_PROFILE=ci VOLUMES=1

  tests:
    name: Тесты ядра и сценариев
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Конфигурация
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Сборка
        run: cmake --build build --parallel

      # Среди тестов есть такие, которые ОБЯЗАНЫ не собираться: они собирают
      # свою цель сами и ждут провала компилятора.
      - name: ctest
        run: ctest --test-dir build --output-on-failure
