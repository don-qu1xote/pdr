# CI ПДР: ярусами, дешёвое раньше дорогого.
#
# Порядок ярусов — не украшение, а главное решение этого файла. Линтер, который
# ждёт компиляции, — самая частая и самая дорогая ошибка в устройстве CI: обратная
# связь по опечатке приезжает через десять минут вместо тридцати секунд.
#
#   ярус 0  что затронуто и сверка профилей — без зависимостей, стартуют сразу
#   ярус 1  ВСЕ проверки, unit-прогон и сборка домена — не ждут ничего
#   ярус 2  contract, интеграционные и планы — им нужна база или собранные цели
#   ярус 3  тяжёлое и редкое: сборка адаптеров в контейнере с userver. Только на
#           push, не на каждый пуш ветки
#
# Правило зависимостей: джоба зависит РОВНО от того, что ей нужно, а не от «всей
# сборки». Тест биллинга не ждёт сборку видеосервиса.
#
# ОДНА ТОЧКА ФОРСИРОВАНИЯ. Условия «или force_all» в джобах нет и не будет:
# scripts/detect_changes.py подмешивает форсирование в флаг области, поэтому
# джоба смотрит только на свой флаг. Следующая новая джоба не может «забыть про
# флаг» — забывать нечего. Это проверяется самопроверкой скрипта.
#
# Действия запинены по коммит-SHA: плавающий тег — это чужой код, который
# меняется без нашего ведома. Рядом с SHA стоит версия — она для человека, а
# работает именно SHA.
#
# Версии обновляются не по номеру, а по рантайму: GitHub гасит Node 20 на своих
# раннерах, и действие на нём даёт предупреждение в каждой джобе. Перед сменой
# пина рантайм проверяется по факту — «using: node24» в action.yml НА ТОМ САМОМ
# коммите, а не по обещанию релизных заметок.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Прогнать весь CI, игнорируя выборочность по путям
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ЯРУС 0 ------------------------------------------------------------------
  changes:
    name: Что затронуто
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.detect.outputs.cpp }}
      python: ${{ steps.detect.outputs.python }}
      db: ${{ steps.detect.outputs.db }}
      deploy: ${{ steps.detect.outputs.deploy }}
      configs: ${{ steps.detect.outputs.configs }}
      docs: ${{ steps.detect.outputs.docs }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      forced: ${{ steps.detect.outputs.forced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Проверка самого скрипта выборочности (отрицательный случай)
        run: python3 scripts/detect_changes.py --selftest

      - name: Что затронуто изменениями
        id: detect
        run: |
          set -eu
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base=''
          fi
          python3 scripts/detect_changes.py \
            ${base:+--base "$base"} \
            ${{ github.event.inputs.full == 'true' && '--force' || '' }}

  parity:
    name: Профили окружения не разъехались
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Проверка самой сверки (отрицательный случай)
        run: python3 scripts/verify_env_parity.py --selftest

      - name: Сверка профилей
        run: python3 scripts/verify_env_parity.py

  # ЯРУС 1 ------------------------------------------------------------------
  guards:
    name: Правила, проверяемые машиной
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Каждая проверка сначала проверяет себя на нарочно испорченном случае:
      # проверка, которая ничего не ловит, зелёная так же, как исправный код.
      - name: Слои и контексты
        run: |
          set -eu
          python3 scripts/check_layers.py --selftest
          python3 scripts/check_layers.py

      - name: Владение таблицами
        run: |
          set -eu
          python3 scripts/check_table_owners.py --selftest
          python3 scripts/check_table_owners.py

      - name: Штатное вместо самодельного
        run: |
          set -eu
          python3 scripts/check_handmade.py --selftest
          python3 scripts/check_handmade.py

      - name: Реестр динамических значений
        run: |
          set -eu
          python3 scripts/check_dynamic_configs.py --selftest
          python3 scripts/check_dynamic_configs.py

      # Настройка «не беспокоить», уровень доступа в условии, поступок без кода
      # события и строковое поле, в которое поместится текст отзыва, роняют
      # сборку здесь. Требование записано словами «не отключается», и без этой
      # проверки оно держалось бы до первой задачи про уведомления.
      - name: Уведомление опекуну не отключается
        run: |
          set -eu
          python3 scripts/check_guardian_notice.py --selftest
          python3 scripts/check_guardian_notice.py

      # Опека, спрошенная в записи на занятие, оплате, отзыве или аналитике,
      # третья роль, вторая таблица наблюдателей и запрос паспорта роняют сборку
      # здесь. Взрослый ученик без опекуна — основной случай: сломанным он
      # обнаруживается на демонстрации, а не в тесте про опеку.
      - name: Взрослый ученик проходит весь путь без опекуна
        run: |
          set -eu
          python3 scripts/check_adult_student.py --selftest
          python3 scripts/check_adult_student.py

      # Статус, назначенный в хендлере, свой формат отказа, потерянный член
      # формы, потерянный заголовок безопасности и глобальный след запроса
      # роняют сборку здесь. Форма задаётся один раз: разошедшись, она
      # заставляет клиента разбирать пять форматов вместо одного.
      - name: Форма HTTP-слоя задана один раз
        run: |
          set -eu
          python3 scripts/check_http_form.py --selftest
          python3 scripts/check_http_form.py

      # Ручка, поднятая и не описанная, и описанная, но снятая, роняют сборку
      # здесь. Спецификация — источник правды для клиентов, и состав её ручек
      # обязан совпадать с тем, что сервис действительно поднимает.
      - name: Состав ручек и спецификация не расходятся
        run: |
          set -eu
          python3 scripts/check_openapi.py --selftest
          python3 scripts/check_openapi.py

      # Событие без вопроса, вопрос без события, продуктовое число без вопроса,
      # поле, именующее человека, и поле, пропавшее из уже опубликованной версии
      # схемы, роняют сборку здесь.
      - name: Продуктовые события и вопросы, на которые они отвечают
        run: |
          set -eu
          python3 scripts/check_product_events.py --selftest
          python3 scripts/check_product_events.py

      # Инженерный термин в тексте, который видит человек, — баг: словарь из
      # docs/product/glossary.md прогоняется по строкам клиента и по самим
      # утверждённым формулировкам. Процент при числе роняет сборку здесь же.
      - name: Словарь продукта
        run: |
          set -eu
          python3 scripts/check_glossary.py --selftest
          python3 scripts/check_glossary.py

      # Как продукт разговаривает: стоп-слова, отказ без альтернативы, код отказа
      # без русского текста, оценка в тексте ученику и «ПДР» в локализации роняют
      # сборку здесь. Node на раннерах ubuntu-latest предустановлен, отдельный
      # шаг установки ему не нужен.
      - name: Правила речи
        run: |
          set -eu
          node scripts/check-copy.mjs --selftest
          node scripts/check-copy.mjs

      # Ревизия открытости: строка про внешнюю зависимость без набора «сервиса
      # нет навсегда», доменная таблица мимо полной выгрузки аккаунта и постулат
      # без ссылки на тест роняют сборку здесь.
      - name: Открытость и постулаты
        run: |
          set -eu
          python3 scripts/check_openness.py --selftest
          python3 scripts/check_openness.py

      # Диаграмма не врёт про готовность: стрелка без состояния, стрелка мимо
      # таблицы, «есть» без файла в дереве и документ мимо оглавления каталога
      # роняют сборку здесь.
      - name: Диаграммы архитектуры
        run: |
          set -eu
          python3 scripts/check_diagrams.py --selftest
          python3 scripts/check_diagrams.py

      # Чужой API не бывает несущим: неофициальный источник в несущей роли,
      # интеграция без посчитанной цены удаления, порт с одной реализацией и
      # чужой идентификатор первичным ключом роняют сборку здесь.
      - name: Внешние интеграции
        run: |
          set -eu
          python3 scripts/check_integrations.py --selftest
          python3 scripts/check_integrations.py

      # У каждого ИИ-узла есть своя реализация: умолчание «своя» сверяется с
      # таблицей узлов, обращение наружу вне адаптера роняет сборку здесь, а
      # замер качества считается на фиксированном наборе, а не на ощущениях.
      - name: Суверенитет ИИ-узлов
        run: |
          set -eu
          python3 scripts/check_sovereignty.py --selftest
          python3 scripts/check_sovereignty.py
          python3 scripts/compare_quality.py --selftest

      - name: Секреты не в окружении и не в истории
        run: |
          set -eu
          python3 scripts/check_secrets.py --selftest
          python3 scripts/check_secrets.py

      # Секрет без записи в реестре, умолчание у секрета, назначение,
      # разошедшееся с кодом, и вернувшийся вывод SecretString роняют сборку
      # здесь. Сервис, поднявшийся с пустым секретом, работает «как будто
      # нормально»: процесс жив, метрика зелёная, платежи не уходят.
      - name: Реестр секретов и код не расходятся
        run: |
          set -eu
          python3 scripts/check_secrets_registry.py --selftest
          python3 scripts/check_secrets_registry.py

      # Получатель мимо ревизии открытости, строка ревизии мимо перечня,
      # категория в коде без строки для человека, пустая клетка и канцелярит
      # роняют сборку здесь. Перечень определяет, что мы вообще имеем право
      # отправить во внешнюю модель, и разойтись с деревом ему нельзя.
      - name: Перечень обработки персональных данных сходится с деревом
        run: |
          set -eu
          python3 scripts/check_personal_data.py --selftest
          python3 scripts/check_personal_data.py

      # Седьмой раздел в шаблоне запроса, чеклист «я протестировал», шаблон,
      # разошедшийся со сборкой тела, и пропавшее правило комментариев роняют
      # сборку здесь. Сливаем мы фазами: запрос без формы — это стена, которую
      # читающий пролистывает и одобряет не читая.
      - name: Правила запроса на слияние
        run: |
          set -eu
          python3 scripts/check_pr_rules.py --selftest
          python3 scripts/check_pr_rules.py
          python3 scripts/pr_body.py --selftest

      - name: Долги первого сервиса собраны в одном списке
        run: |
          set -eu
          python3 scripts/check_debts.py --selftest
          python3 scripts/check_debts.py

      - name: Правила тестового контура
        run: |
          set -eu
          python3 scripts/check_testsuite.py --selftest
          python3 scripts/check_testsuite.py

      # Колонка uuid, выбранная адаптером как есть, роняет сборку здесь — а не
      # первый живой запрос пятисоткой. Драйвер отказывается отдавать uuid
      # строкой в рантайме, и ни компилятор, ни unit-прогон этого не видят.
      - name: Идентификаторы читаются текстом
        run: |
          set -eu
          python3 scripts/check_uuid_reads.py --selftest
          python3 scripts/check_uuid_reads.py

  migrations:
    name: Миграции, изоляция и документ схемы
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Правила колонок
        run: |
          set -eu
          python3 scripts/check_migrations.py --selftest
          python3 scripts/check_migrations.py

      # Доменная таблица без RLS роняет сборку здесь и нигде больше.
      - name: Изоляция арендаторов описана в схеме
        run: |
          set -eu
          python3 scripts/check_rls.py --selftest
          python3 scripts/check_rls.py

      # Документ схемы собирается из миграций; расхождение означает, что его
      # правили руками или забыли пересобрать.
      - name: Документ схемы свежий
        run: python3 scripts/gen_schema_doc.py --check

  comments:
    name: Комментарии
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Джоба без условия по областям намеренно: правило действует на все языки
      # разом, а комментарий, нарушающий его, приезжает вместе с любой правкой.
      #
      # Та же цель Makefile, что зовёт человек у себя и хук githooks/pre-commit:
      # не три похожие команды, а буквально одна.
      - name: Проверка самой проверки (отрицательный случай)
        run: python3 scripts/check_comments.py --selftest

      - name: Только то, без чего не соберётся сборка
        run: make comments

  lint:
    name: Формат кода
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Версия форматтера берётся из .clang-format-version — из того же файла, по
      # которому её проверит make fmt-check. Ставить «какой есть в образе»
      # нельзя: раннер обновится, версия уедет, и красным станет чужой код.
      - name: Форматтер закреплённой версии
        run: |
          set -eu
          version="$(cat .clang-format-version)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-format-$version"

      # Та же цель Makefile, что зовёт человек у себя и хук githooks/pre-commit:
      # не три похожие команды, а буквально одна. Иначе «у меня чисто» и «в CI
      # красно» расходятся, и виноватым выглядит CI.
      - name: clang-format
        run: make fmt-check

      # clang-tidy сюда придёт вместе со своим .clang-tidy: без файла настроек он
      # либо молчит, либо заваливает шумом из чужих заголовков, и первое хуже
      # второго — проверка, которая ничего не проверяет, выглядит как проверка.

  unit:
    name: Unit — домен и сценарии на фейках
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-build
        with:
          cache-key: unit

      # Ни Postgres, ни докера: если unit-прогону понадобилась база, протекли
      # слои. Конфигурация CMake это и проверяет — цель pdr_unit_tests не
      # линкуется с адаптерами.
      - name: Сборка и прогон
        run: |
          set -eu
          cmake --build build --target pdr_unit_tests --parallel
          ctest --test-dir build --output-on-failure -R '^unit$'

      - name: Цели, которые ОБЯЗАНЫ не собираться
        run: ctest --test-dir build --output-on-failure -R compile_fail

  contract:
    name: Contract — фейк и настоящий адаптер
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-build
        with:
          cache-key: contract

      - name: Один набор на обеих реализациях
        run: |
          set -eu
          cmake --build build --target pdr_contract_tests pdr_broken_fake_contract_test \
            pdr_broken_integration_contract_test pdr_network_bound_contract_test --parallel
          ctest --test-dir build --output-on-failure -R '^contract'

  domain-without-userver:
    name: Домен собирается без userver
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # userver в этом окружении не установлен намеренно: если pdr_core или
      # pdr_application от него зависят, шаг не соберётся. Тесты выключены —
      # шаг про домен, а не про оснастку.
      - name: Конфигурация без тестов
        run: cmake -S . -B build-domain -DCMAKE_BUILD_TYPE=Debug -DPDR_BUILD_TESTS=OFF

      - name: Сборка pdr_core и pdr_infrastructure
        run: cmake --build build-domain --target pdr_core pdr_infrastructure --parallel

  coverage:
    name: Покрытие unit-прогона
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Инструменты
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build gcovr

      # Порог НЕ жёсткий и джобу не роняет: 70% — это право резать код, а не
      # самоцель (README). Число печатается в лог, включение порога — отдельной
      # задачей, когда появится, чем его закрывать.
      - name: Собрать с покрытием и посчитать
        run: |
          set -eu
          cmake -S . -B build-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='--coverage -O0' -DCMAKE_EXE_LINKER_FLAGS='--coverage'
          cmake --build build-coverage --target pdr_unit_tests --parallel
          ctest --test-dir build-coverage --output-on-failure -R '^unit$'
          gcovr --root . --filter 'libs/.*/src/' --exclude '.*/tests/.*' \
            --print-summary --txt-metric line || true

  # ЯРУС 2 ------------------------------------------------------------------
  integration:
    name: "Живая база: изоляция и одиночные задания"
    runs-on: ubuntu-latest
    needs: [changes, parity]
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Тем же единственным compose, что и на машине разработчика, — профилем ci.
      - name: Профиль ci
        run: cp deploy/env/ci.env.example deploy/env/ci.env

      # Секреты: в CI настоящих нет, но файл обязан лежать на месте — иначе
      # Docker монтирует пустой каталог, а SecretsGuard падает при старте.
      - name: Секреты
        run: |
          cat > deploy/secrets/secrets.json <<'EOF'
          {
            "pdr": {
              "postgres_dsn": "postgresql://pdr:ci-not-a-secret@127.0.0.1:5432/pdr"
            },
            "postgresql_settings": {
              "databases": {
                "pdr": [
                  {
                    "shard_number": 0,
                    "hosts": [
                      "postgresql://pdr:ci-not-a-secret@127.0.0.1:5432/pdr"
                    ]
                  }
                ]
              }
            }
          }
          EOF

      - name: Поднять и применить миграции
        run: make up ENV_PROFILE=ci

      - name: Логи scheduling при ошибке
        if: failure()
        run: docker compose --env-file deploy/env/ci.env -f deploy/docker-compose.yml logs scheduling

      # Второй прогон обязан ничего не применять: повтор идемпотентен.
      - name: Повтор ничего не меняет
        run: |
          set -eu
          make migrate ENV_PROFILE=ci | tee /tmp/second-run.log
          grep -q "Применять нечего" /tmp/second-run.log

      - name: Сверка сумм
        run: make migrate-verify ENV_PROFILE=ci

      # Политика, написанная правильно, и политика, работающая правильно, —
      # разные утверждения. Между ними помещается роль-суперпользователь,
      # снятая руками защита и опечатка в имени параметра сессии.
      - name: Изоляция арендаторов на живой базе
        run: make test-isolation ENV_PROFILE=ci

      # «Одновременно» бывает только в базе: на фейках второй воркер, ставящий
      # тот же след, — это утверждение, а не проверка.
      - name: Одиночные задания на живой базе
        run: make test-jobs ENV_PROFILE=ci

      # Два одинаковых запроса, пришедшие одновременно, обязаны завести РОВНО
      # ОДНУ сущность. На фейках это утверждение: мьютекс в процессе про вторую
      # реплику не знает, а тут сессии разные — как разными бывают реплики.
      - name: Идемпотентность на живой базе
        run: make test-idempotency ENV_PROFILE=ci

      # Хранение и выгрузка продуктового потока: обе цели ходят в живую базу, и
      # обе ломаются молча — опечатка в SQL выясняется в день, когда выгрузку
      # спросят. Выгрузка идёт под административной ролью: pdr_app без
      # объявленного арендатора не видит ни строки, и это проверено выше.
      - name: Выгрузка обезличенного потока
        run: |
          set -eu
          make product-events-export ENV_PROFILE=ci OUT=/tmp/product-events.csv
          head -1 /tmp/product-events.csv | \
            grep -qx 'tenant_id,type,version,actor_role,occurred_at,recorded_at,fields'
          ! grep -qiE '(person|email|phone|login)' /tmp/product-events.csv

      - name: Уборка по сроку жизни
        run: |
          set -eu
          make product-events-prune ENV_PROFILE=ci DAYS=30
          ! make product-events-prune ENV_PROFILE=ci

      # «Данные ваши» — обещание, которое подтверждается работающей командой.
      # Проверяется и то, что выгрузка отдаёт данные, и то, что она отдаёт
      # ТОЛЬКО их: арендатор в выгрузке ровно один.
      - name: Полная выгрузка аккаунта
        run: |
          set -eu
          tenant=0d0d0d0d-0000-4000-8000-000000000007
          make account-export ENV_PROFILE=ci TENANT="$tenant" OUT=/tmp/account.json
          python3 - "$tenant" <<'PY'
          import json
          import sys

          account = json.load(open("/tmp/account.json", encoding="utf-8"))
          parts = account["parts"]
          expected = {
              "identity_tenant",
              "identity_person",
              "identity_role_assignment",
              "identity_guardianship",
              "identity_access_log",
              "identity_consent",
              "observability_product_event",
          }
          assert set(parts) == expected, f"состав выгрузки разошёлся: {sorted(parts)}"
          assert all(parts[name] for name in expected), "часть выгрузки пуста на засеянной базе"
          tenants = {row["tenant_id"] for rows in parts.values() for row in rows}
          assert tenants == {sys.argv[1]}, f"в выгрузке чужие арендаторы: {sorted(tenants)}"
          print(f"выгрузка: частей {len(parts)}, арендатор один")
          PY

      - name: Погасить вместе с томами
        if: always()
        run: make down ENV_PROFILE=ci VOLUMES=1

  service:
    name: "Первый процесс: контур и живая база"
    runs-on: ubuntu-latest
    needs: [changes, unit]
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.deploy == 'true'
    # Образ тот же, что в ярусе 3: сервис — это и есть userver, и собрать его
    # без него нельзя. Ярус всё-таки второй, а не третий: это уже не «собирается
    # ли адаптер», а «работает ли процесс», и узнавать это раз в пуш поздно.
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:latest
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Счёт паролей и сервер базы. Без первого не собирается вход (цель
      # пропускается конфигурацией, а не подменяется — ADR-0013); без второго
      # штатному контуру нечего поднимать: в образе есть только клиент.
      - name: Библиотека счёта паролей и сервер базы
        run: |
          set -eu
          apt-get update -qq --allow-releaseinfo-change
          apt-get install -y -qq libargon2-dev postgresql-14

      # Штатный контур отказывается работать от root, и правильно делает.
      - name: Пользователь для прогона
        run: |
          set -eu
          useradd --create-home --uid 2000 pdrtest
          chown -R pdrtest "$GITHUB_WORKSPACE"

      - name: Конфигурация и сборка процесса
        run: |
          set -eu
          cmake -S . -B build-service -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-service --target pdr_scheduling_service pdr_live_tests --parallel
          chown -R pdrtest build-service

      # Contract-набор хранилища ВТОРОЙ раз — против настоящего адаптера, и
      # продуктовый поток в настоящей таблице. Базу поднимает и гасит контур.
      - name: Настоящий адаптер на живой базе
        run: su pdrtest -c 'ctest --test-dir build-service --output-on-failure -R pdr_live_tests'

      # Ручки состояния, задание с точкой контроля, вход сквозь все слои.
      - name: Контур первого процесса
        run: |
          su pdrtest -c 'ctest --test-dir build-service --output-on-failure \
            -R "^testsuite-pdr_scheduling_service$"'

      # Настоящие ответы сервиса против схем из docs/api/openapi.yaml. Без этого
      # набора спецификация устаревает за две недели — это происходит всегда.
      - name: Ответы сходятся со спецификацией
        run: |
          su pdrtest -c 'ctest --test-dir build-service --output-on-failure \
            -R testsuite-pdr_scheduling_service-openapi'

  plans:
    name: "Живая база: планы горячих запросов"
    runs-on: ubuntu-latest
    needs: [changes, parity]
    if: needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Профиль ci
        run: cp deploy/env/ci.env.example deploy/env/ci.env

      - name: Секреты
        run: |
          cat > deploy/secrets/secrets.json <<'EOF'
          {
            "pdr": {
              "postgres_dsn": "postgresql://pdr:ci-not-a-secret@127.0.0.1:5432/pdr"
            },
            "postgresql_settings": {
              "databases": {
                "pdr": [
                  {
                    "shard_number": 0,
                    "hosts": [
                      "postgresql://pdr:ci-not-a-secret@127.0.0.1:5432/pdr"
                    ]
                  }
                ]
              }
            }
          }
          EOF

      - name: Поднять и применить миграции
        run: make up ENV_PROFILE=ci

      - name: Логи scheduling при ошибке
        if: failure()
        run: docker compose --env-file deploy/env/ci.env -f deploy/docker-compose.yml logs scheduling

      # Потерянный индекс не даёт ни ошибки, ни красного теста — только время
      # ответа, и только там, где данных много, то есть не у разработчика.
      # Цель сама засевает объём: на пустой базе перебор — правильный план, и
      # проверять было бы нечего (docs/architecture/plans.md).
      - name: Планы горячих запросов
        run: make test-plans ENV_PROFILE=ci

      - name: Погасить вместе с томами
        if: always()
        run: make down ENV_PROFILE=ci VOLUMES=1

  # ЯРУС 3 ------------------------------------------------------------------
  adapters-with-userver:
    name: Адаптеры собираются с настоящим userver
    runs-on: ubuntu-latest
    needs: [changes, unit]
    # Только на push и только когда менялся C++: образ с userver весит гигабайты,
    # и на каждый пуш ветки его тянуть незачем.
    if: github.event_name == 'push' && needs.changes.outputs.cpp == 'true'
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver:latest
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Argon2id считается ЭТАЛОННОЙ БИБЛИОТЕКОЙ, а не своей схемой (ADR-0013).
      # В образе userver лежит только libargon2.so.1 — без заголовков цель
      # счёта паролей пропускается конфигурацией, и проверять было бы нечего.
      - name: Библиотека счёта паролей
        run: |
          set -eu
          apt-get update -qq --allow-releaseinfo-change
          apt-get install -y -qq libargon2-dev

      # ПЕРВАЯ настоящая проверка слоя адаптеров: без userver цели
      # pdr_postgres, pdr_jobs_infrastructure, pdr_billing_infrastructure и
      # pdr_identity_infrastructure пропускаются конфигурацией, то есть не
      # компилируются вовсе (docs/architecture/first-service.md).
      - name: Конфигурация с userver
        run: cmake -S . -B build-userver -DCMAKE_BUILD_TYPE=Debug

      - name: Сборка адаптеров
        run: |
          set -eu
          cmake --build build-userver --target pdr_postgres pdr_crypto \
            pdr_jobs_infrastructure pdr_billing_infrastructure \
            pdr_identity_infrastructure pdr_identity_passwords --parallel

      # Проверки адаптеров против ШТАТНЫХ заглушек userver: умолчание из кода без
      # источника, применение без пересоздания адаптера, отказ значению вне
      # диапазона со старым значением на месте и журнал «было → стало». Сюда же
      # попадает настоящий счёт пароля Argon2id и настоящий источник
      # случайности. Ни сервиса, ни базы им не нужно — нужен только userver, а
      # он есть здесь.
      - name: Адаптеры против заглушек userver
        run: |
          set -eu
          cmake --build build-userver --target pdr_adapter_tests --parallel
          ctest --test-dir build-userver --output-on-failure -R '^adapter$'
