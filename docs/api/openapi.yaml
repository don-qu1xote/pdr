openapi: 3.1.0

info:
  title: ПОЛЯ — API
  version: 1.0.0
  summary: Внешний контур платформы репетиторов
  description: |
    ИСТОЧНИК ПРАВДЫ — ЭТОТ ФАЙЛ, а не код. Клиенты порождают типы отсюда
    (docs/adr/0009-monorepo-with-clients.md), поэтому спецификация пишется
    первой, а ручка — под неё.

    Обратное направление — сборка спецификации из кода — отвергнуто намеренно:
    тогда источником правды становится реализация, и «мы поменяли ответ» и «мы
    поменяли контракт» перестают различаться. Расхождение здесь ловится двумя
    проверками с разных сторон: `scripts/check_openapi.py` сверяет СОСТАВ ручек,
    а contract-набор `tests/contract/openapi_conformance` прогоняет настоящие
    ответы сервиса против схем.

    Правила версионирования и что считается ломающим изменением —
    docs/api/README.md.
  contact:
    name: Правила изменения контракта
    url: https://github.com/don-qu1xote/pdr/blob/main/docs/api/README.md
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Локальная установка (deploy/README.md)

tags:
  - name: Состояние
    description: |
      Ручки состояния процесса. ВНЕ `/api/v1` намеренно: их читает оркестратор,
      а не клиент, схема у них не развивается, и версионировать нечего.
  - name: Вход
    description: Единственная дверь, у которой сессии ещё нет — она её создаёт.
  - name: Спецификация
    description: Тот же документ, что здесь, для инструментов.
  - name: Расписание
    description: |
      Занятия, серии и доступность репетитора. Права на КАЖДОЕ обращение
      спрашиваются у политики: репетитор, ученик и опекун ходят по одним и тем
      же адресам и видят разное.

paths:
  /ping:
    get:
      tags: [Состояние]
      operationId: ping
      summary: Штатная проверка живости для балансера
      description: |
        Ручка userver, оставленная на месте (ADR-0013). Отвечает пустым телом:
        балансеру нужен код ответа, а не содержимое.

        Тип содержимого у неё `application/octet-stream` — умолчание userver для
        ручки, которая его не назвала. Так и описано: спецификация говорит, что
        сервис делает, а не что нам хотелось бы. Своих ручек это не касается —
        они называют тип явно.
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/octet-stream:
              schema:
                type: string
                maxLength: 0
        '500':
          description: Компонент в неисправном состоянии
          content:
            application/octet-stream:
              schema:
                type: string

  /health:
    get:
      tags: [Состояние]
      operationId: health
      summary: Процесс жив
      description: |
        Отвечает и тогда, когда база недоступна. Перезапускать процесс из-за
        упавшего хранилища — значит превратить сбой базы в отсутствие сервиса и
        потерять вместе с ним логи и метрики того, кто мог бы объяснить, что
        случилось. Готовность принимать трафик — соседняя ручка.
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'

  /readiness:
    get:
      tags: [Состояние]
      operationId: readiness
      summary: Готов принимать трафик
      description: |
        Готовность — это два условия сразу: база отвечает И схема не отстала от
        файлов. Процесс на отставшей схеме отвечает на запросы и молча делает не
        то: колонки, которой он ждёт, в базе ещё нет.

        Ответ 503 здесь НЕ problem+json, и это единственное исключение во всём
        контуре. Оно названо и обосновано в docs/api/README.md: проба не
        отказывает в запросе, она отвечает на вопрос, а читает её оркестратор,
        который тела не разбирает вовсе.
      responses:
        '200':
          description: База отвечает, миграции применены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: База недоступна или схема пуста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/openapi.json:
    get:
      tags: [Спецификация]
      operationId: openapiDocument
      summary: Спецификация как JSON
      description: |
        Тот же документ, что в docs/api/openapi.yaml, переведённый в JSON:
        инструменты порождения клиентов читают JSON, а человек — YAML. Второго
        источника правды не появляется — файл на диске один.
      responses:
        '200':
          description: Спецификация
          content:
            application/json:
              schema:
                type: object
                description: Документ OpenAPI 3.1

  /api/v1/cabinet/{tenant}/sign-in:
    post:
      tags: [Вход]
      operationId: signIn
      summary: Войти в кабинет
      description: |
        АРЕНДАТОР БЕРЁТСЯ ИЗ АДРЕСА КАБИНЕТА, а не из тела и не из cookie: почта
        уникальна ВНУТРИ арендатора, и «войти вообще» не выражается.

        Сессия выдаётся заголовком `Set-Cookie` с атрибутами `HttpOnly`,
        `Secure`, `SameSite=Lax`, а не полем тела: `HttpOnly` ставится только
        заголовком, и положить сессию в тело значит попросить клиента самого
        сделать её недоступной скрипту, а он не сможет.

        Неудачи НЕРАЗЛИЧИМЫ: нет такой записи, есть запись без пароля, пароль не
        подошёл — ответ один и тот же (`sign_in_refused`). Иначе форма входа
        превращается в способ узнать, кто у нас учится.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Вошли, сессия выдана в cookie
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInAnswer'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

  /api/v1/availability:
    get:
      tags: [Расписание]
      operationId: getAvailability
      summary: Когда репетитор готов работать
      description: |
        ЧЬЯ ДОСТУПНОСТЬ — говорит параметр `whose`; без него отвечают про самого
        спрашивающего. Права спрашиваются у политики: свою доступность видит
        репетитор, чужую — владелец практики.

        ОТСУТСТВИЕ ДОСТУПНОСТИ И ПУСТАЯ ДОСТУПНОСТЬ — РАЗНЫЕ ОТВЕТЫ. Не задавал
        — приходит `404`: занятия к нему просто требуют подтверждения. Задал и
        стёр всё — приходит `200` с пустыми списками: он не работает никогда.
        Слить их в один ответ значило бы не дать репетитору сказать «не работаю».
      parameters:
        - $ref: '#/components/parameters/Whose'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      responses:
        '200':
          description: Доступность репетитора
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'
    put:
      tags: [Расписание]
      operationId: setAvailability
      summary: Записать доступность целиком
      description: |
        ЦЕЛИКОМ, А НЕ ПО ПРАВИЛУ, и это форма самого обращения: `PUT` заменяет
        доступность на присланную. Экран работает так же — репетитор правит
        расписание и сохраняет, — а обращение «добавить одно правило» заставило
        бы клиента помнить порядок операций и оставляло бы половину расписания
        записанной, когда связь оборвалась посередине.
      parameters:
        - $ref: '#/components/parameters/Whose'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Availability'
      responses:
        '200':
          description: Доступность записана
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

  /api/v1/lessons:
    get:
      tags: [Расписание]
      operationId: listLessons
      summary: Занятия за отрезок
      description: |
        ОДИН АДРЕС НА ТРОИХ — репетитора, ученика и опекуна. Разные у них не
        обращения, а права: `whose` называет человека, чьё расписание просят, а
        `side` — какой стороной занятий он в нём стоит. Политика решает по этой
        паре, и решает по-разному: свои занятия видит каждый, чужие — только
        опекун своего подопечного и владелец практики.

        ДВЕ СТОРОНЫ, А НЕ ОДНА ВЫБОРКА «ПРО ЧЕЛОВЕКА»: один и тот же человек
        ведёт свои занятия и учится на чужих, и это два разных расписания. Под
        каждую сторону в базе заведён свой индекс, и третьей стороны нет,
        потому что третьего запроса нет.

        ЗАНЯТИЙ СЕРИИ ЗДЕСЬ НЕТ. Серия хранится правилом, а не строками
        (PDR-SCHED-02), и её вхождения считаются, а не читаются; считать их
        нечем, пока в дереве нет порта правил часовых поясов.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Side'
        - $ref: '#/components/parameters/Whose'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      responses:
        '200':
          description: Занятия по возрастанию начала
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lessons'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'
    post:
      tags: [Расписание]
      operationId: createLesson
      summary: Записать ученика на занятие
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLesson'
      responses:
        '200':
          description: Занятие записано
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

  /api/v1/lessons/{lesson}:
    get:
      tags: [Расписание]
      operationId: getLesson
      summary: Одно занятие
      description: |
        ЧЬЁ РАСПИСАНИЕ СМОТРЯТ — сказано теми же `whose` и `side`, что и у
        выборки за отрезок, и не для симметрии: права спрашиваются про
        расписание человека, а «чьё это занятие» до чтения неизвестно. Спросить
        политику дважды — один раз ни о чём, второй по прочитанному — значит
        завести две проверки прав, которые разойдутся.

        Занятия, которого в названном расписании нет, ЗДЕСЬ НЕТ ТАК ЖЕ, как
        несуществующего: иначе по коду ответа перебираются чужие занятия.
      parameters:
        - $ref: '#/components/parameters/Lesson'
        - $ref: '#/components/parameters/Side'
        - $ref: '#/components/parameters/Whose'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      responses:
        '200':
          description: Занятие
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

  /api/v1/lesson-series:
    post:
      tags: [Расписание]
      operationId: createSeries
      summary: Завести регулярные занятия
      description: |
        СЕРИЯ ЗАВОДИТСЯ ПРАВИЛОМ, и занятий после этого обращения не появляется
        ни одного: сорок строк, созданных при заведении, расходятся с правилом
        на первом же переносе. Вхождения серии считаются по запросу.

        Правило приходит строкой RRULE — тем подмножеством RFC 5545, которым
        пользуется репетиторство: недельная частота, интервал, дни недели и один
        конец из двух. Часть вне подмножества — названный отказ, а не тихий
        пропуск.

        ВРЕМЯ СЕРИИ — МЕСТНОЕ, а не UTC: «каждый вторник в 18:00» это
        утверждение про часы репетитора, и после перевода часов занятие остаётся
        в 18:00 у него.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSeries'
      responses:
        '200':
          description: Серия заведена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

components:
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Кабинет, в который входят. Идентификатор арендатора.
      schema:
        $ref: '#/components/schemas/Uuid'

    Whose:
      name: whose
      in: query
      required: false
      description: |
        Чьё расписание. Без него — расписание самого спрашивающего.

        Отдельный параметр, а не догадка по ролям: опекун смотрит подопечного,
        владелец практики — репетитора, и «чьё» из роли не выводится. Права на
        названного человека спрашиваются у политики.
      schema:
        $ref: '#/components/schemas/Uuid'

    Side:
      name: side
      in: query
      required: true
      description: |
        Какой стороной названный человек стоит в этих занятиях: ведёт их или
        занимается. Два разных расписания одного человека, и под каждое в базе
        заведён свой индекс.
      schema:
        $ref: '#/components/schemas/LessonSide'

    From:
      name: from
      in: query
      required: true
      description: |
        Начало отрезка включительно: микросекунды от начала эпохи в UTC. Число,
        а не строка: у клиента и у сервера разные представления о том, как
        записать момент, а у числа их нет.
      schema:
        $ref: '#/components/schemas/Moment'

    To:
      name: to
      in: query
      required: true
      description: Конец отрезка НЕ включительно, теми же микросекундами.
      schema:
        $ref: '#/components/schemas/Moment'

    Lesson:
      name: lesson
      in: path
      required: true
      description: Занятие.
      schema:
        $ref: '#/components/schemas/Uuid'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        ОБЯЗАТЕЛЕН НА КАЖДОМ МЕНЯЮЩЕМ ОБРАЩЕНИИ, и это не пожелание: без него
        повтор по оборванной связи выполняет операцию второй раз. Клиент
        придумывает ключ сам и повторяет запрос С ТЕМ ЖЕ ключом; в течение срока
        жизни ключа (динамическое значение `PDR_IDEMPOTENCY`) он получает
        сохранённый ответ, а не второе выполнение.

        Тот же ключ с ДРУГИМ телом — ошибка клиента, а не повтор:
        `idempotency_key_reused`.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^\S+$'
      example: sign-in-7f3c1a94-6d0b-4f2e-9c31-8a5b0e2d4c77

    ClientTimeout:
      name: X-YaTaxi-Client-TimeoutMs
      in: header
      required: false
      description: |
        СКОЛЬКО МИЛЛИСЕКУНД КЛИЕНТ ГОТОВ ЖДАТЬ. Не пожелание: по этому сроку
        сервис обрывает работу, которую клиент всё равно уже не примет, и не даёт
        очереди такой работы добить себя под перегрузкой.

        Остаток времени доходит до запросов к базе сам — доведение срока
        (`USERVER_DEADLINE_PROPAGATION_ENABLED`) включено. Срок, истёкший до того,
        как до запроса дошли, — это `498`, и работа не начинается вовсе.

        Имя заголовка не наше: так его называет штатный механизм userver, и
        переименовать его значило бы написать свой (ADR-0013).
      schema:
        type: integer
        minimum: 1
        maximum: 600000
      example: 5000

    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        След запроса. Свой годный принимается и возвращается нетронутым, иначе
        сервис заводит собственный. Он же приходит в ответе и в теле отказа:
        жалобу «у меня не работает» разбирают по нему, а человек может назвать
        только то, что видел сам.
      schema:
        $ref: '#/components/schemas/RequestIdValue'

  headers:
    RequestId:
      description: След запроса — тот же, что в теле отказа.
      required: true
      schema:
        $ref: '#/components/schemas/RequestIdValue'

    IdempotencyReplayed:
      description: |
        Стоит только на ПОВТОРЕ: ответ взят из сохранённого, операция второй раз
        не выполнялась.
      required: false
      schema:
        type: string
        pattern: '^true$'

    SetSessionCookie:
      description: |
        Сессия. Имя `__Host-pdr_session` — не стиль, а требование браузера:
        cookie с такой приставкой принимается только с `Secure`, только с
        корневого пути и только без `Domain`, поэтому поддомен одного арендатора
        не может подсунуть свою cookie другому.

        НА ПОВТОРЕ ЗАГОЛОВКА НЕТ, и это не упущение: повтор отдаёт сохранённые
        тело и код, а сессия у клиента уже есть с первого раза. Повтор узнаётся
        по `Idempotency-Replayed`.
      required: false
      schema:
        type: string
      example: __Host-pdr_session=...; HttpOnly; Secure; SameSite=Lax; Path=/

  responses:
    Malformed:
      description: Запрос не разобрался или не хватает обязательного заголовка
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unidentified:
      description: |
        Кто вы. 401 говорит клиенту войти заново, 403 — что входить бесполезно;
        родом доменной ошибки это не выражается, поэтому шаг опознания отвечает
        отдельно.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: |
        Нельзя. 403 отличается от 401 тем, что входить заново бесполезно: дело
        не в том, кто вы, а в том, что это не ваше.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Missing:
      description: |
        Такого здесь нет. Чужой кабинет отвечает тем же самым: иначе по коду
        ответа перебирается то, чего видеть нельзя.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Состояние не позволяет выполнить сейчас
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Refused:
      description: Данные не проходят правило домена
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Expired:
      description: |
        Срок, отведённый КЛИЕНТОМ (`X-YaTaxi-Client-TimeoutMs`), истёк раньше, чем
        до запроса дошли. Работа не начиналась: ни транзакции, ни занятого ключа
        повтора после этого ответа не остаётся — тот же ключ можно прислать
        снова, и он сработает как первый.

        498, а не 504, и разница не в номере. 504 означает «мы кого-то ждали и не
        дождались» — наша неудача, повтор осмыслен. 498 означает «времени не было
        с самого начала»: повторять то же самое с тем же сроком незачем, надо
        дать срок больше.

        ЭТОТ ОТВЕТ НЕ problem+json, и это ВТОРОЕ названное исключение во всём
        контуре (первое — 503 у `/readiness`). Отвечает не наша форма, а штатный
        механизм доведения срока: он обрывает запрос ДО хендлера, и потому ни
        одного нашего заголовка и ни одной нашей строки в ответе нет.

        БОЛЬШЕ ТОГО: тип содержимого здесь НЕ СХОДИТСЯ С ТЕЛОМ. Приходит
        `application/json`, а телом лежит обычный текст «Deadline expired». Это
        дефект штатного механизма, и описан он тут как есть — спецификация
        говорит, что сервис делает, а не что нам хотелось бы.

        Отсюда правило для клиента: НА 498 ТЕЛО НЕ РАЗБИРАЮТ. Всё, что нужно
        знать, — в самом коде: срок вышел, работа не начиналась, повторять надо с
        большим сроком.

        Своей формой это не переписать, не написав свой базовый хендлер, — а он
        запрещён (ADR-0013).
      content:
        application/json:
          schema:
            type: string
          example: Deadline expired

    Broken:
      description: Поломка на нашей стороне
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f607

    RequestIdValue:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      example: 018f2b3c4d5e4f608a71b2c3d4e5f607

    Liveness:
      type: object
      additionalProperties: false
      required: [alive]
      properties:
        alive:
          type: boolean
          description: |
            Процесс отвечает. Про базу это не говорит ничего.

            Всегда `true`, и записать это в схеме нечем: `const` порождение
            типов ломает (docs/api/README.md, «Чего спецификация себе не
            позволяет»). Обещание проверяет contract-набор, а не схема.
      example:
        alive: true

    Readiness:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
          description: Можно ли давать трафик
        migrations:
          type: integer
          minimum: 0
          description: |
            Сколько миграций применено. Отсутствует, когда база не ответила
            вовсе: посчитать было негде.
        why:
          type: string
          minLength: 1
          description: Чего не хватает. Появляется только у неготовности.
      example:
        ready: false
        migrations: 0
        why: 'схема пуста: миграции не применены'

    Moment:
      type: integer
      format: int64
      description: |
        Момент: микросекунды от начала эпохи в UTC. Число, а не строка — у
        клиента и у сервера разные представления о том, как записать момент, а у
        числа их нет. `format: int64` не украшение: микросекунды эпохи не
        вмещаются в тридцать два бита уже сегодня.
      example: 1780000000000000

    Zone:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Имя зоны IANA. Хранится РЯДОМ С МОМЕНТОМ, а не вместо него: занятие в
        18:00 по Берлину, перенесённое государством на час, обязано остаться в
        18:00 по Берлину, и без зоны рядом это невыразимо.
      example: Europe/Moscow

    CalendarDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: |
        Календарная дата без времени и без зоны. Не момент: пока не сказано, в
        какой зоне, она не превращается ни в какое мгновение.
      example: '2026-03-02'

    ClockTime:
      type: string
      pattern: '^\d{2}:\d{2}$'
      description: |
        Время на часах: часы и минуты. Секунд нет — занятия не назначают на
        18:30:17, а лишняя точность требует решать, что с ней делать при
        сравнении.
      example: '18:00'

    Minutes:
      type: integer
      minimum: 1
      maximum: 1440
      description: Длительность занятия в минутах.
      example: 60

    Weekday:
      type: integer
      minimum: 0
      maximum: 6
      description: |
        День недели, воскресенье — ноль. Та же нумерация, что у
        `std::chrono::weekday` и в схеме базы: вторая нумерация того же самого
        разошлась бы с первой в тот день, когда поправили одну.
      example: 2

    LessonSide:
      type: string
      description: |
        Сторона занятия: `tutor` — ведёт, `participant` — занимается. Не роль в
        кабинете: один и тот же человек ведёт свои занятия и учится на чужих.
      enum:
        - tutor
        - participant
      example: tutor

    LessonState:
      type: string
      description: |
        Состояние занятия. Список закрытый: свободная строка в этом месте
        означает, что через полгода в базе окажутся «held », «HELD» и
        «проведено», а сравнивать их будет некому.
      enum:
        - planned
        - confirmed
        - held
        - cancelled
        - no_show
      example: planned

    Nothing:
      type: object
      additionalProperties: false
      description: |
        ТЕЛА У ЭТОГО ОБРАЩЕНИЯ НЕТ. Схема всё равно есть и всё равно пустая: тело
        разбирает форма запроса, одна на все ручки, и «здесь тела не бывает» она
        выражает пустым объектом, а не отсутствием схемы. Присланное поле
        отвергается — `additionalProperties: false` тут и работает.
      example: {}

    AvailabilityRule:
      type: object
      additionalProperties: false
      required: [weekday, from, to, tz]
      description: Когда репетитор готов работать по этому дню недели.
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        from:
          $ref: '#/components/schemas/ClockTime'
        to:
          $ref: '#/components/schemas/ClockTime'
        tz:
          $ref: '#/components/schemas/Zone'
      example:
        weekday: 2
        from: '10:00'
        to: '18:00'
        tz: Europe/Moscow

    AvailabilityException:
      type: object
      additionalProperties: false
      required: [date]
      description: |
        День, который живёт не по недельному правилу. БЕЗ ЧАСОВ — ВЫХОДНОЙ, и это
        не «забыли заполнить»: «в этот день не работаю» и «в этот день работаю с
        двух до четырёх» — разные ответы, и первый обязан выражаться.

        Часы здесь моментами, а не показаниями часов: исключение назначают на
        конкретный день, и зона у него уже есть — та, в которой стоит правило.
      properties:
        date:
          $ref: '#/components/schemas/CalendarDate'
        from:
          $ref: '#/components/schemas/Moment'
        to:
          $ref: '#/components/schemas/Moment'
      example:
        date: '2026-03-09'

    Availability:
      type: object
      additionalProperties: false
      required: [rules, exceptions]
      description: |
        Доступность репетитора целиком: недельные правила и исключения по датам.
        Исключение сильнее правила — на дату с исключением правила дня недели не
        смотрят вовсе.
      properties:
        rules:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/AvailabilityRule'
        exceptions:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/AvailabilityException'
      example:
        rules:
          - weekday: 2
            from: '10:00'
            to: '18:00'
            tz: Europe/Moscow
        exceptions: []

    Lesson:
      type: object
      additionalProperties: false
      required: [id, tutor, participants, starts_at, ends_at, tz, state]
      description: |
        Занятие. ДВА МОМЕНТА, а не момент и длительность: ограничение
        непересечения в базе строится на отрезке, и длительность из пары моментов
        получается вычитанием.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tutor:
          $ref: '#/components/schemas/Uuid'
        participants:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            Кто занимается. МАССИВ, А НЕ ОДИН УЧЕНИК: групповые занятия
            появятся, и переделывать под них контракт — это ломать клиентов.
            Сегодняшнее правило домена ограничивает список единицей, и это
            правило, а не форма.
          items:
            $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Moment'
        ends_at:
          $ref: '#/components/schemas/Moment'
        tz:
          $ref: '#/components/schemas/Zone'
        state:
          $ref: '#/components/schemas/LessonState'
      example:
        id: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f607
        tutor: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f601
        participants: [018f2b3c-4d5e-4f60-8a71-b2c3d4e5f602]
        starts_at: 1780000000000000
        ends_at: 1780003600000000
        tz: Europe/Moscow
        state: planned

    Lessons:
      type: object
      additionalProperties: false
      required: [lessons]
      description: |
        Занятия по возрастанию начала. ОБЪЕКТ, А НЕ ГОЛЫЙ МАССИВ: массив на
        верхнем уровне некуда расширить, не сломав клиентов, — а расширять
        придётся, как только появится постраничность.
      properties:
        lessons:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/Lesson'
      example:
        lessons: []

    NewLesson:
      type: object
      additionalProperties: false
      required: [tutor, student, starts_at, minutes, tz]
      description: |
        Запись ученика на занятие. Зона — та, в которой человек НАЗВАЛ время, а
        не та, в которой он его смотрит.
      properties:
        tutor:
          $ref: '#/components/schemas/Uuid'
        student:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Moment'
        minutes:
          $ref: '#/components/schemas/Minutes'
        tz:
          $ref: '#/components/schemas/Zone'
      example:
        tutor: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f601
        student: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f602
        starts_at: 1780000000000000
        minutes: 60
        tz: Europe/Moscow

    NewSeries:
      type: object
      additionalProperties: false
      required: [tutor, student, rrule, starts_on, at, minutes, tz]
      description: Регулярные занятия правилом.
      properties:
        tutor:
          $ref: '#/components/schemas/Uuid'
        student:
          $ref: '#/components/schemas/Uuid'
        rrule:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Правило повторения строкой RFC 5545 — поддержанным подмножеством:
            `FREQ=WEEKLY`, `INTERVAL`, `BYDAY` и один конец из двух (`COUNT`
            либо `UNTIL`). Всё остальное отклоняется вслух.
          example: FREQ=WEEKLY;INTERVAL=1;BYDAY=TU;COUNT=8
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        at:
          $ref: '#/components/schemas/ClockTime'
        minutes:
          $ref: '#/components/schemas/Minutes'
        tz:
          $ref: '#/components/schemas/Zone'
      example:
        tutor: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f601
        student: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f602
        rrule: FREQ=WEEKLY;INTERVAL=1;BYDAY=TU;COUNT=8
        starts_on: '2026-03-03'
        at: '18:00'
        minutes: 60
        tz: Europe/Moscow

    Series:
      type: object
      additionalProperties: false
      required: [id, tutor, participants, rrule, starts_on, at, minutes, tz]
      description: |
        Заведённая серия. ЗАНЯТИЙ В НЕЙ НЕТ И НЕ БУДЕТ: она хранится правилом, а
        вхождения считаются по запросу.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tutor:
          $ref: '#/components/schemas/Uuid'
        participants:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/Uuid'
        rrule:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            То же правило, каким его прочитал разбор. Может отличаться от
            присланного порядком частей: строку собирает домен, а не эхо запроса.
        starts_on:
          $ref: '#/components/schemas/CalendarDate'
        at:
          $ref: '#/components/schemas/ClockTime'
        minutes:
          $ref: '#/components/schemas/Minutes'
        tz:
          $ref: '#/components/schemas/Zone'
      example:
        id: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f608
        tutor: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f601
        participants: [018f2b3c-4d5e-4f60-8a71-b2c3d4e5f602]
        rrule: FREQ=WEEKLY;INTERVAL=1;BYDAY=TU;COUNT=8
        starts_on: '2026-03-03'
        at: '18:00'
        minutes: 60
        tz: Europe/Moscow

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Почта. Уникальна ВНУТРИ арендатора, а не на площадке.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Пароль. `format: password` здесь НЕ СТОИТ намеренно: он не описывает
            значение, а просит показывалку спрятать ввод, — и порождение типов
            его не понимает (docs/api/README.md, «Чего спецификация себе не
            позволяет»).
      example:
        email: mail@example.org
        password: correct-horse-battery

    SignInAnswer:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: integer
          format: int64
          description: |
            Когда сессия перестанет действовать: микросекунды от начала эпохи в
            UTC. Число, а не строка: у клиента и у сервера разные представления
            о том, как записать момент, а у числа их нет.

            `format: int64` не украшение: без него порождённое поле сорокового
            года не вмещает, а микросекунды эпохи не вмещает уже сегодня.
      example:
        expires_at: 1780000000000000

    Problem:
      type: object
      description: |
        ФОРМА ОТКАЗА ОДНА НА ВСЮ СИСТЕМУ — RFC 9457. Второй формы не заводят
        даже «на один случай»: разобрать пять форматов приходится всем, а чинить
        их — никому. Дублировать эту схему по ручкам тоже нельзя, и это не вкус:
        копия расходится с оригиналом в тот день, когда правку внесли в одну.
      additionalProperties: false
      required: [type, title, status, detail, instance, request_id]
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          minLength: 1
          description: Короткое имя рода отказа. Одно на код, не зависит от обстоятельств.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: |
            Что случилось в этот раз — человеку и в журнал. Клиент разбирает
            `type`, а не эту строку: она меняется без предупреждения.
        instance:
          type: string
          minLength: 1
          description: Путь запроса, на котором отказали.
        request_id:
          $ref: '#/components/schemas/RequestIdValue'
        field:
          type: string
          minLength: 1
          description: |
            Поле, из-за которого отказ, — путь внутри тела запроса. Появляется
            только у отказа разбора: «bad request» без имени поля отправляет
            человека угадывать, а разработчика — читать схему глазами.
      example:
        type: urn:pdr:error:request_field_invalid
        title: Запрос не проходит схему
        status: 400
        detail: 'поле «email» не проходит схему: слишком короткое'
