openapi: 3.1.0

info:
  title: ПОЛЯ — API
  version: 1.0.0
  summary: Внешний контур платформы репетиторов
  description: |
    ИСТОЧНИК ПРАВДЫ — ЭТОТ ФАЙЛ, а не код. Клиенты порождают типы отсюда
    (docs/adr/0009-monorepo-with-clients.md), поэтому спецификация пишется
    первой, а ручка — под неё.

    Обратное направление — сборка спецификации из кода — отвергнуто намеренно:
    тогда источником правды становится реализация, и «мы поменяли ответ» и «мы
    поменяли контракт» перестают различаться. Расхождение здесь ловится двумя
    проверками с разных сторон: `scripts/check_openapi.py` сверяет СОСТАВ ручек,
    а contract-набор `tests/contract/openapi_conformance` прогоняет настоящие
    ответы сервиса против схем.

    Правила версионирования и что считается ломающим изменением —
    docs/api/README.md.
  contact:
    name: Правила изменения контракта
    url: https://github.com/don-qu1xote/pdr/blob/main/docs/api/README.md
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Локальная установка (deploy/README.md)

tags:
  - name: Состояние
    description: |
      Ручки состояния процесса. ВНЕ `/api/v1` намеренно: их читает оркестратор,
      а не клиент, схема у них не развивается, и версионировать нечего.
  - name: Вход
    description: Единственная дверь, у которой сессии ещё нет — она её создаёт.
  - name: Спецификация
    description: Тот же документ, что здесь, для инструментов.

paths:
  /ping:
    get:
      tags: [Состояние]
      operationId: ping
      summary: Штатная проверка живости для балансера
      description: |
        Ручка userver, оставленная на месте (ADR-0013). Отвечает пустым телом:
        балансеру нужен код ответа, а не содержимое.

        Тип содержимого у неё `application/octet-stream` — умолчание userver для
        ручки, которая его не назвала. Так и описано: спецификация говорит, что
        сервис делает, а не что нам хотелось бы. Своих ручек это не касается —
        они называют тип явно.
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/octet-stream:
              schema:
                type: string
                maxLength: 0
        '500':
          description: Компонент в неисправном состоянии
          content:
            application/octet-stream:
              schema:
                type: string

  /health:
    get:
      tags: [Состояние]
      operationId: health
      summary: Процесс жив
      description: |
        Отвечает и тогда, когда база недоступна. Перезапускать процесс из-за
        упавшего хранилища — значит превратить сбой базы в отсутствие сервиса и
        потерять вместе с ним логи и метрики того, кто мог бы объяснить, что
        случилось. Готовность принимать трафик — соседняя ручка.
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'

  /readiness:
    get:
      tags: [Состояние]
      operationId: readiness
      summary: Готов принимать трафик
      description: |
        Готовность — это два условия сразу: база отвечает И схема не отстала от
        файлов. Процесс на отставшей схеме отвечает на запросы и молча делает не
        то: колонки, которой он ждёт, в базе ещё нет.

        Ответ 503 здесь НЕ problem+json, и это единственное исключение во всём
        контуре. Оно названо и обосновано в docs/api/README.md: проба не
        отказывает в запросе, она отвечает на вопрос, а читает её оркестратор,
        который тела не разбирает вовсе.
      responses:
        '200':
          description: База отвечает, миграции применены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: База недоступна или схема пуста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/openapi.json:
    get:
      tags: [Спецификация]
      operationId: openapiDocument
      summary: Спецификация как JSON
      description: |
        Тот же документ, что в docs/api/openapi.yaml, переведённый в JSON:
        инструменты порождения клиентов читают JSON, а человек — YAML. Второго
        источника правды не появляется — файл на диске один.
      responses:
        '200':
          description: Спецификация
          content:
            application/json:
              schema:
                type: object
                description: Документ OpenAPI 3.1

  /api/v1/cabinet/{tenant}/sign-in:
    post:
      tags: [Вход]
      operationId: signIn
      summary: Войти в кабинет
      description: |
        АРЕНДАТОР БЕРЁТСЯ ИЗ АДРЕСА КАБИНЕТА, а не из тела и не из cookie: почта
        уникальна ВНУТРИ арендатора, и «войти вообще» не выражается.

        Сессия выдаётся заголовком `Set-Cookie` с атрибутами `HttpOnly`,
        `Secure`, `SameSite=Lax`, а не полем тела: `HttpOnly` ставится только
        заголовком, и положить сессию в тело значит попросить клиента самого
        сделать её недоступной скрипту, а он не сможет.

        Неудачи НЕРАЗЛИЧИМЫ: нет такой записи, есть запись без пароля, пароль не
        подошёл — ответ один и тот же (`sign_in_refused`). Иначе форма входа
        превращается в способ узнать, кто у нас учится.
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientTimeout'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Вошли, сессия выдана в cookie
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInAnswer'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unidentified'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '498':
          $ref: '#/components/responses/Expired'
        '500':
          $ref: '#/components/responses/Broken'

components:
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Кабинет, в который входят. Идентификатор арендатора.
      schema:
        $ref: '#/components/schemas/Uuid'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        ОБЯЗАТЕЛЕН НА КАЖДОМ МЕНЯЮЩЕМ ОБРАЩЕНИИ, и это не пожелание: без него
        повтор по оборванной связи выполняет операцию второй раз. Клиент
        придумывает ключ сам и повторяет запрос С ТЕМ ЖЕ ключом; в течение срока
        жизни ключа (динамическое значение `PDR_IDEMPOTENCY`) он получает
        сохранённый ответ, а не второе выполнение.

        Тот же ключ с ДРУГИМ телом — ошибка клиента, а не повтор:
        `idempotency_key_reused`.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^\S+$'
      example: sign-in-7f3c1a94-6d0b-4f2e-9c31-8a5b0e2d4c77

    ClientTimeout:
      name: X-YaTaxi-Client-TimeoutMs
      in: header
      required: false
      description: |
        СКОЛЬКО МИЛЛИСЕКУНД КЛИЕНТ ГОТОВ ЖДАТЬ. Не пожелание: по этому сроку
        сервис обрывает работу, которую клиент всё равно уже не примет, и не даёт
        очереди такой работы добить себя под перегрузкой.

        Остаток времени доходит до запросов к базе сам — доведение срока
        (`USERVER_DEADLINE_PROPAGATION_ENABLED`) включено. Срок, истёкший до того,
        как до запроса дошли, — это `498`, и работа не начинается вовсе.

        Имя заголовка не наше: так его называет штатный механизм userver, и
        переименовать его значило бы написать свой (ADR-0013).
      schema:
        type: integer
        minimum: 1
        maximum: 600000
      example: 5000

    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        След запроса. Свой годный принимается и возвращается нетронутым, иначе
        сервис заводит собственный. Он же приходит в ответе и в теле отказа:
        жалобу «у меня не работает» разбирают по нему, а человек может назвать
        только то, что видел сам.
      schema:
        $ref: '#/components/schemas/RequestIdValue'

  headers:
    RequestId:
      description: След запроса — тот же, что в теле отказа.
      required: true
      schema:
        $ref: '#/components/schemas/RequestIdValue'

    IdempotencyReplayed:
      description: |
        Стоит только на ПОВТОРЕ: ответ взят из сохранённого, операция второй раз
        не выполнялась.
      required: false
      schema:
        type: string
        pattern: '^true$'

    SetSessionCookie:
      description: |
        Сессия. Имя `__Host-pdr_session` — не стиль, а требование браузера:
        cookie с такой приставкой принимается только с `Secure`, только с
        корневого пути и только без `Domain`, поэтому поддомен одного арендатора
        не может подсунуть свою cookie другому.

        НА ПОВТОРЕ ЗАГОЛОВКА НЕТ, и это не упущение: повтор отдаёт сохранённые
        тело и код, а сессия у клиента уже есть с первого раза. Повтор узнаётся
        по `Idempotency-Replayed`.
      required: false
      schema:
        type: string
      example: __Host-pdr_session=...; HttpOnly; Secure; SameSite=Lax; Path=/

  responses:
    Malformed:
      description: Запрос не разобрался или не хватает обязательного заголовка
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unidentified:
      description: |
        Кто вы. 401 говорит клиенту войти заново, 403 — что входить бесполезно;
        родом доменной ошибки это не выражается, поэтому шаг опознания отвечает
        отдельно.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Состояние не позволяет выполнить сейчас
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Refused:
      description: Данные не проходят правило домена
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Expired:
      description: |
        Срок, отведённый КЛИЕНТОМ (`X-YaTaxi-Client-TimeoutMs`), истёк раньше, чем
        до запроса дошли. Работа не начиналась: ни транзакции, ни занятого ключа
        повтора после этого ответа не остаётся — тот же ключ можно прислать
        снова, и он сработает как первый.

        498, а не 504, и разница не в номере. 504 означает «мы кого-то ждали и не
        дождались» — наша неудача, повтор осмыслен. 498 означает «времени не было
        с самого начала»: повторять то же самое с тем же сроком незачем, надо
        дать срок больше.

        ЭТОТ ОТВЕТ НЕ problem+json, и это ВТОРОЕ названное исключение во всём
        контуре (первое — 503 у `/readiness`). Отвечает не наша форма, а штатный
        механизм доведения срока: он обрывает запрос ДО хендлера, и потому ни
        одного нашего заголовка и ни одной нашей строки в ответе нет.

        БОЛЬШЕ ТОГО: тип содержимого здесь НЕ СХОДИТСЯ С ТЕЛОМ. Приходит
        `application/json`, а телом лежит обычный текст «Deadline expired». Это
        дефект штатного механизма, и описан он тут как есть — спецификация
        говорит, что сервис делает, а не что нам хотелось бы.

        Отсюда правило для клиента: НА 498 ТЕЛО НЕ РАЗБИРАЮТ. Всё, что нужно
        знать, — в самом коде: срок вышел, работа не начиналась, повторять надо с
        большим сроком.

        Своей формой это не переписать, не написав свой базовый хендлер, — а он
        запрещён (ADR-0013).
      content:
        application/json:
          schema:
            type: string
          example: Deadline expired

    Broken:
      description: Поломка на нашей стороне
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 018f2b3c-4d5e-4f60-8a71-b2c3d4e5f607

    RequestIdValue:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'
      example: 018f2b3c4d5e4f608a71b2c3d4e5f607

    Liveness:
      type: object
      additionalProperties: false
      required: [alive]
      properties:
        alive:
          type: boolean
          description: |
            Процесс отвечает. Про базу это не говорит ничего.

            Всегда `true`, и записать это в схеме нечем: `const` порождение
            типов ломает (docs/api/README.md, «Чего спецификация себе не
            позволяет»). Обещание проверяет contract-набор, а не схема.
      example:
        alive: true

    Readiness:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
          description: Можно ли давать трафик
        migrations:
          type: integer
          minimum: 0
          description: |
            Сколько миграций применено. Отсутствует, когда база не ответила
            вовсе: посчитать было негде.
        why:
          type: string
          minLength: 1
          description: Чего не хватает. Появляется только у неготовности.
      example:
        ready: false
        migrations: 0
        why: 'схема пуста: миграции не применены'

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Почта. Уникальна ВНУТРИ арендатора, а не на площадке.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Пароль. `format: password` здесь НЕ СТОИТ намеренно: он не описывает
            значение, а просит показывалку спрятать ввод, — и порождение типов
            его не понимает (docs/api/README.md, «Чего спецификация себе не
            позволяет»).
      example:
        email: mail@example.org
        password: correct-horse-battery

    SignInAnswer:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: integer
          format: int64
          description: |
            Когда сессия перестанет действовать: микросекунды от начала эпохи в
            UTC. Число, а не строка: у клиента и у сервера разные представления
            о том, как записать момент, а у числа их нет.

            `format: int64` не украшение: без него порождённое поле сорокового
            года не вмещает, а микросекунды эпохи не вмещает уже сегодня.
      example:
        expires_at: 1780000000000000

    Problem:
      type: object
      description: |
        ФОРМА ОТКАЗА ОДНА НА ВСЮ СИСТЕМУ — RFC 9457. Второй формы не заводят
        даже «на один случай»: разобрать пять форматов приходится всем, а чинить
        их — никому. Дублировать эту схему по ручкам тоже нельзя, и это не вкус:
        копия расходится с оригиналом в тот день, когда правку внесли в одну.
      additionalProperties: false
      required: [type, title, status, detail, instance, request_id]
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          minLength: 1
          description: Короткое имя рода отказа. Одно на код, не зависит от обстоятельств.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: |
            Что случилось в этот раз — человеку и в журнал. Клиент разбирает
            `type`, а не эту строку: она меняется без предупреждения.
        instance:
          type: string
          minLength: 1
          description: Путь запроса, на котором отказали.
        request_id:
          $ref: '#/components/schemas/RequestIdValue'
        field:
          type: string
          minLength: 1
          description: |
            Поле, из-за которого отказ, — путь внутри тела запроса. Появляется
            только у отказа разбора: «bad request» без имени поля отправляет
            человека угадывать, а разработчика — читать схему глазами.
      example:
        type: urn:pdr:error:request_field_invalid
        title: Запрос не проходит схему
        status: 400
        detail: 'поле «email» не проходит схему: слишком короткое'
        instance: /api/v1/cabinet/018f2b3c-4d5e-4f60-8a71-b2c3d4e5f607/sign-in
        request_id: 018f2b3c4d5e4f608a71b2c3d4e5f607
        field: email

    ProblemType:
      type: string
      description: |
        ОПОЗНАВАТЕЛЬ РОДА ОТКАЗА, ПЕРЕЧИСЛЕНИЕМ, а не свободной строкой. Клиент
        сравнивает `type` с константой, и константа обязана быть в контракте:
        иначе он сравнивает строки, которые мы переименовываем не спросив.

        URN, а не ссылка: страницы с описанием у нас нет, а `type`, ведущий в
        никуда, — обещание, которого мы не выполняем.

        Список пополняется без смены версии — новый род отказа старый клиент
        просто не узнает и покажет `title`. УДАЛЕНИЕ значения ломающее:
        docs/api/README.md.

        В списке только то, что клиент может увидеть. Коды проверки внутренних
        настроек сюда не входят: их человек не видит вовсе
        (docs/product/voice.md, «Коды, которых человек не увидит»). Что сегодня
        сломанный динамический конфиг всё-таки выпускает такой код наружу —
        названо в docs/api/README.md как расхождение, а не узаконено здесь.
      example: urn:pdr:error:sign_in_refused
      enum:
        - urn:pdr:error:request_not_json
        - urn:pdr:error:request_field_invalid
        - urn:pdr:error:idempotency_key_required
        - urn:pdr:error:idempotency_key_in_flight
        - urn:pdr:error:idempotency_key_reused
        - urn:pdr:error:cabinet_unknown
        - urn:pdr:error:sign_in_refused
        - urn:pdr:error:sign_in_throttled
