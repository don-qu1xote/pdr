# Реестр секретов ПДР.
#
# Список того, без чего сервис не имеет права подняться. Задача мелкая, а ловит
# она целый класс отказов: сервис, поднявшийся с пустым секретом и работающий
# «как будто нормально». Процесс жив, метрика зелёная, платежи не уходят — и
# узнаёт об этом человек, у которого не прошёл платёж, а не мониторинг.
#
# ЗНАЧЕНИЙ ПО УМОЛЧАНИЮ ЗДЕСЬ НЕТ И НЕ БУДЕТ. Умолчание вида "change-me"
# опаснее отсутствия: отсутствие роняет старт сразу, а умолчание доживает до
# прода и работает. Поэтому у записи есть «откуда взять», но нет «чему равно».
#
# Расхождение реестра с кодом роняет сборку: scripts/check_secrets_registry.py
# сверяет имена, назначения и ожидание в обе стороны с core::kEverySecret.
#
# ПОЧЕМУ ЗДЕСЬ НЕТ ПОРОЖДЕНИЯ ТИПОВ, а у динамических значений есть (PDR-ARCH-09).
# Реестр значений описывает ФОРМУ: у каждой величины схема с полями, типами и
# пределами, и структура на C++ была вторым текстом про то же самое — её и стали
# порождать. Этот реестр описывает НАЛИЧИЕ: секрет либо есть, либо старт
# отказывает, а значение у всех одно и то же — строка, и никакой формы у неё нет.
# Порождать из «наличия» нечего: разбор secdist читает раздел "pdr" как открытый
# набор «имя — строка» и не знает имён заранее, а знать их и не должен — имена
# перечислены в core::kEverySecret и сверяются с этим файлом.
#
# Их к тому же мало и они не меняются: шесть записей за всё время. Порождение
# окупается там, где текст дублируется и расходится, — здесь дублировать нечего.
#
# ГДЕ ОНИ ЛЕЖАТ. В файле secdist, в разделе "pdr", права 0600; путь к файлу —
# переменная PDR_SECDIST_PATH. Окружение несёт ПУТЬ, а не значения: переменные
# видны в /proc, попадают в дампы процесса и в отчёты об ошибках
# (deploy/README.md, PDR-SEC-06). В динамических конфигах секретов не бывает
# вовсе: там продуктовые числа, их меняют без выкатки и пишут в журнал изменений.
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ каждой записи:
#   description  что это и что сломается без него, словами для человека
#   purpose      назначение: database | payment_provider | webhook_signing |
#                video_provider. Секреты РАЗНЫХ назначений не могут иметь
#                одинаковое значение — старт откажет
#   source       откуда взять: у кого спросить, в каком кабинете сгенерировать
#
# НЕОБЯЗАТЕЛЬНОЕ ПОЛЕ:
#   awaits       область задачи, которая заведёт читателя секрета. Пока оно
#                стоит, секрет при старте не спрашивается: требовать ключ от
#                двери, которой нет, — верный способ приучить человека вписывать
#                "change-me". Когда читатель появляется, поле снимается тем же
#                изменением; проверка роняет сборку и на записи без читателя без
#                «awaits», и на «awaits» при уже существующем читателе.
#
# ПРО НАЗНАЧЕНИЕ. Оно не бюрократия: два секрета с одним значением означают, что
# утечка одного равна утечке обоих. Самый частый способ получить это — вставить
# из буфера обмена дважды, и заметить это глазами на ревью нельзя, потому что в
# файле секретов ревью не бывает.

postgres_dsn:
  description: >-
    Строка подключения к единственному хранилищу проекта — вместе с паролем роли
    приложения. Без неё сервис не сходит в базу ни за чем: ни человека узнать,
    ни занятие записать.
  purpose: database
  source: >-
    Пароль роли pdr в вашей установке. Локально — то, что вы положили в
    POSTGRES_PASSWORD профиля (deploy/env/local.env); в общей установке — у того,
    кто её держит. Форма строки задана userver, раздел postgresql_settings —
    deploy/secrets/secrets.json.example.

yookassa_shop_id:
  description: >-
    Идентификатор магазина в ЮKassa. Без него обращения к провайдеру уходят «ни
    от кого», и платежи не создаются.
  purpose: payment_provider
  awaits: BILL
  source: >-
    Личный кабинет ЮKassa, раздел «Настройки → Магазин». Выдаётся вместе с
    секретным ключом и без него бесполезен.

yookassa_secret_key:
  description: >-
    Секретный ключ ЮKassa: им подписываются НАШИ обращения к провайдеру. Утечка
    означает чужие платежи и чужие возвраты от нашего имени.
  purpose: payment_provider
  awaits: BILL
  source: >-
    Личный кабинет ЮKassa, раздел «Настройки → API-ключи». Показывается один
    раз при создании; потерянный ключ не восстанавливается, а перевыпускается.

yookassa_webhook_secret:
  description: >-
    Ключ проверки подписи входящих уведомлений ЮKassa. Им проверяется, что
    «платёж прошёл» прислал провайдер, а не тот, кто узнал адрес нашей ручки.
  purpose: webhook_signing
  awaits: BILL
  source: >-
    Личный кабинет ЮKassa, раздел «Настройки → HTTP-уведомления», при создании
    подписки на события. ЭТО ДРУГОЙ КЛЮЧ, не секретный ключ API: совпали
    значения — старт откажет, и правильно сделает.

livekit_api_key:
  description: >-
    Идентификатор ключа доступа к серверу видеозанятий. Без него токен комнаты
    не выписать, и занятие не начнётся.
  purpose: video_provider
  awaits: VIDEO
  source: >-
    Свой self-hosted LiveKit (ADR-0004): пара ключ/секрет задаётся в его
    конфигурации при развёртывании и берётся оттуда же.

livekit_api_secret:
  description: >-
    Секрет ключа доступа к серверу видеозанятий: им подписывается токен комнаты.
    Утечка означает чужой вход в занятие ребёнка.
  purpose: video_provider
  awaits: VIDEO
  source: >-
    Та же пара, что и livekit_api_key, из конфигурации своего LiveKit.
