# Реестр динамических значений ПДР.
#
# Число, влияющее на людей, живёт здесь, а не в константе: данных для его
# обоснования нет и год не будет, значит оно будет меняться — и ни одно
# изменение не должно требовать передеплоя.
#
# Механизм — ШТАТНЫЙ dynamic_config userver. Этот файл не читается сервисом: он
# реестр, а не источник. Значения по умолчанию живут в коде (dynamic_config::Key),
# и сервис поднимается на них, даже если источник конфигов недоступен. Реестр
# отвечает на другие вопросы: что это за величина, в каких пределах она
# осмысленна, что сломается за пределами и с кем разговаривать.
#
# Расхождение реестра с кодом роняет сборку: scripts/check_dynamic_configs.py
# сверяет имена, типы и значения по умолчанию в обе стороны.
#
# ЧЕГО СХЕМА НЕ ЛОВИТ. Пределы одной колонки схема задаёт, а связь между двумя —
# нет: «окно меньше порога» и «период меньше отведённого на прогон» из неё не
# выражаются. Такие правила проверяет домен при разборе значения (например
# jobs::JobSettings::Compose), и негодная запись отвергается целиком — старое
# значение продолжает действовать. Это проверено: см. цель pdr_adapter_tests.
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ каждой записи:
#   description   что это и на что влияет, словами для человека
#   kind          техническая | продуктовая
#   owner         кто решает, каким должно быть значение
#   jurisdiction  привязано ли значение к стране по существу: да | нет
#   breaks        что сломается, если выйти за пределы
#   default       значение по умолчанию — ровно то же, что объявлено в коде
#   schema        JSON-схема с пределами: minimum и maximum обязательны у чисел
#
# НЕОБЯЗАТЕЛЬНОЕ ПОЛЕ:
#   awaits        область задачи, которая заведёт ключ в коде: величина решена в
#                 фазе 0, а кода, который её читает, ещё нет
#
# ПРО «awaits». Смысл задачи в том, чтобы число попало сюда РАНЬШЕ, чем зашьётся
# в код константой. Поэтому запись без ключа разрешена — но только с именем
# области, которая ключ заведёт, и область сверяется с закрытым списком в
# CONTRIBUTING.md. Когда ключ появляется, поле снимается тем же изменением:
# проверка роняет сборку и на записи без ключа без «awaits», и на записи с
# «awaits» при уже объявленном ключе. Ждать вечно у записи не получится.
#
# Умолчание у ждущей записи — предложение, а не факт: сверять его пока не с чем.
# Как только ключ объявлен, проверка начинает требовать совпадения с кодом.
#
# ПРО ЮРИСДИКЦИЮ. Сегодня рынок один — российский, и георазбивки нет ни в
# схеме, ни в коде. Пометка нужна не для неё: часть значений привязана к стране
# по существу (возрастные пороги самостоятельности, окна отмены, всё про чеки и
# налоговый статус, состав согласий). Пометка стоит копейки сейчас и превращает
# будущий выход в другую страну из ревизии всего продукта в разбор списка
# помеченных строк. Останется один рынок — пометка просто не пригодится.
#
# ПРО ВИД. Продуктовые значения правятся без участия разработчика — в этом и
# смысл задачи. Технические (таймауты, размеры пулов, сроки блокировок) правит
# тот, кто держит сервис.

PDR_PERIODIC_JOBS:
  description: >-
    Одиночные периодические задания: под каким именем задание берёт блокировку,
    как часто просыпается, сколько отведено одному прогону и после какого
    молчания оно считается замолчавшим. Ключ словаря — имя компонента задания.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    period_ms меньше attempt_ms — прогоны наезжают друг на друга и второй
    начинается, пока первый не отпустил блокировку. silence_allowed_ms меньше
    period_ms — тревога о молчании срабатывает на каждом прогоне, и через неделю
    на метрику перестают смотреть. Значения проверяются доменом
    (jobs::JobSettings::Compose): негодная запись отвергается целиком, старая
    продолжает действовать.
  default: {}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [lock, period_ms, attempt_ms, silence_allowed_ms, enabled]
      properties:
        lock:
          description: имя строки блокировки в jobs_lock
          type: string
          pattern: '^[a-z][a-z0-9._-]*[a-z0-9]$'
          maxLength: 64
        period_ms:
          description: как часто задание просыпается
          type: integer
          minimum: 1000
          maximum: 86400000
        attempt_ms:
          description: сколько отведено одному прогону, он же срок блокировки
          type: integer
          minimum: 100
          maximum: 86400000
        silence_allowed_ms:
          description: после какого молчания задание считается замолчавшим
          type: integer
          minimum: 1000
          maximum: 604800000
        enabled:
          description: выключенное задание блокировку не берёт вовсе
          type: boolean

PDR_SELF_ACCOUNT_AGE:
  description: >-
    С какого возраста ученик заводит учётную запись сам и действует без опекуна.
    Ниже порога опекун обязателен: связь, согласия и доступ к записям идут через
    него.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  awaits: IDENT
  breaks: >-
    Порог ниже установленного законом — платформа обрабатывает данные ребёнка
    без законного представителя. Порог выше — взрослый самостоятельный ученик
    (языки, подготовка в вуз) не может завести себе занятие и упирается в
    требование опекуна, которого у него нет.
  default: 14
  schema:
    type: integer
    minimum: 6
    maximum: 21

PDR_REQUIRED_CONSENTS:
  description: >-
    Какие согласия обязательны до первого занятия: обработка данных, запись
    занятия, передача данных опекуну. Список, а не флаги: состав меняется вместе
    с законом, а не вместе с релизом.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  awaits: IDENT
  breaks: >-
    Недостающее согласие — обработка данных без основания. Лишнее — человек
    подписывает то, чего продукт не делает, и перестаёт читать любые согласия.
  default: ["personal_data", "lesson_recording"]
  schema:
    type: array
    items:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      maxLength: 64

PDR_BOOKING_WINDOWS:
  description: >-
    Окна бронирования: за сколько до занятия его ещё можно записать и до какого
    момента отменить без удержания. Часы, потому что человек думает в часах.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: да
  awaits: SCHED
  breaks: >-
    Окно записи слишком короткое — ученик не может записаться на завтра, и
    расписание пустует при живом спросе. Окно отмены слишком длинное — репетитор
    теряет оплаченное время без возможности его продать; слишком короткое —
    ученик платит за занятие, которое отменил заранее, и это спор, который
    решает не платформа, а закон.
  default: {"booking_before_hours": 2, "free_cancel_before_hours": 24}
  schema:
    type: object
    additionalProperties: false
    required: [booking_before_hours, free_cancel_before_hours]
    properties:
      booking_before_hours:
        description: за сколько часов до начала занятие ещё можно записать
        type: integer
        minimum: 0
        maximum: 168
      free_cancel_before_hours:
        description: до какого момента отмена бесплатна
        type: integer
        minimum: 0
        maximum: 336

PDR_LESSONS_PER_DAY_LIMIT:
  description: >-
    Сколько занятий в день платформа позволяет назначить одному ученику. Не
    техническое ограничение, а забота: подряд поставленные занятия перестают
    учить.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: да
  awaits: SCHED
  breaks: >-
    Ноль — записаться нельзя вовсе. Слишком много — платформа помогает
    поставить ребёнку шесть занятий подряд и отвечает за последствия; учебная
    нагрузка несовершеннолетних ограничена санитарными нормами, и нормы эти у
    каждой страны свои.
  default: 4
  schema:
    type: integer
    minimum: 1
    maximum: 12

PDR_SCHEDULE_HORIZON:
  description: >-
    Горизонт расписания: на сколько дней вперёд открыты слоты и как часто
    механизм пересматривает горизонт, продлевая его.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: SCHED
  breaks: >-
    Горизонт короче периода пересмотра — слоты кончаются раньше, чем механизм
    просыпается их продлить, и ученик видит пустое расписание. Слишком длинный
    горизонт — репетитор обязуется на полгода вперёд и потом отменяет.
  default: {"open_days": 30, "review_period_hours": 24}
  schema:
    type: object
    additionalProperties: false
    required: [open_days, review_period_hours]
    properties:
      open_days:
        description: на сколько дней вперёд открыты слоты
        type: integer
        minimum: 1
        maximum: 365
      review_period_hours:
        description: как часто пересматривается горизонт
        type: integer
        minimum: 1
        maximum: 168

PDR_AUTOCHARGE_OBJECTION_WINDOW:
  description: >-
    Сколько часов после уведомления об автосписании у плательщика есть, чтобы
    возразить, — до того как деньги спишутся.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  awaits: BILL
  breaks: >-
    Ноль — деньги списываются без возможности возразить, и это не «удобно», а
    претензия. Слишком большое окно — репетитор ждёт оплаты неделю после
    занятия. Правила уведомления о списании и срок возражения задаёт закон о
    правах потребителя, а он свой в каждой стране.
  default: 48
  schema:
    type: integer
    minimum: 1
    maximum: 336

PDR_RECEIPT_DEADLINE:
  description: >-
    Сколько часов отведено на выдачу чека после того, как платёж прошёл, и
    сколько раз механизм повторяет попытку, если чек не выдался.
  kind: продуктовая
  owner: владелец продукта вместе с бухгалтером
  jurisdiction: да
  awaits: BILL
  breaks: >-
    Срок больше законного — чек выдан с опозданием, и отвечает за это репетитор
    как самозанятый. Ноль повторов — единственный сбой оператора оставляет
    платёж без чека, и никто об этом не узнает. Сроки выдачи чека и налоговый
    статус продавца — целиком вопрос страны.
  default: {"deadline_hours": 24, "retries": 5}
  schema:
    type: object
    additionalProperties: false
    required: [deadline_hours, retries]
    properties:
      deadline_hours:
        description: за сколько часов чек обязан быть выдан
        type: integer
        minimum: 1
        maximum: 168
      retries:
        description: сколько раз повторить попытку выдачи
        type: integer
        minimum: 0
        maximum: 20

PDR_REPUTATION_PRIOR:
  description: >-
    Сила априора в репутации репетитора: сколько условных средних отзывов
    подмешивается к настоящим, пока их мало. Новичок с одной пятёркой не должен
    обгонять репетитора с сотней четвёрок.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: REP
  breaks: >-
    Ноль — первая же оценка задирает или топит репетитора целиком, и подбор
    начинает выдавать случайных людей. Слишком много — сто настоящих отзывов не
    сдвигают оценку, и репутация перестаёт что-либо значить.
  default: 10
  schema:
    type: integer
    minimum: 0
    maximum: 200

PDR_REVIEW_PUBLICATION:
  description: >-
    Порог публикации отзыва: сколько отзывов должно накопиться у репетитора,
    прежде чем они станут видны, и сколько часов отзыв ждёт до публикации.
    Задержка — чтобы отзыв нельзя было связать с конкретным занятием.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: REP
  breaks: >-
    Порог в один отзыв — первый же недовольный виден всем и виден один. Слишком
    высокий порог — отзывы копятся годами и не публикуются никогда. Нулевая
    задержка — ученик узнаваем по времени занятия, и честного отзыва больше не
    будет.
  default: {"min_reviews": 3, "delay_hours": 72}
  schema:
    type: object
    additionalProperties: false
    required: [min_reviews, delay_hours]
    properties:
      min_reviews:
        description: сколько отзывов нужно, чтобы они стали видны
        type: integer
        minimum: 1
        maximum: 50
      delay_hours:
        description: сколько часов отзыв ждёт до публикации
        type: integer
        minimum: 0
        maximum: 720

PDR_MATCHING_NEWCOMER_SHARE:
  description: >-
    Какая доля выдачи подбора отводится репетиторам без отзывов. В процентах,
    целым числом: доля дробным числом от нуля до единицы читается на глаз
    неверно ровно один раз, и этого хватает.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: MATCH
  breaks: >-
    Ноль — новичок не получает ни одного показа, отзывов у него не появится
    никогда, и подбор навсегда закрыт для новых репетиторов. Сто — выдача
    состоит из людей, о которых ничего не известно, и ученик уходит.
  default: 20
  schema:
    type: integer
    minimum: 0
    maximum: 100

PDR_REPEATED_MISTAKE:
  description: >-
    Порог повторяющейся ошибки: сколько раз ученик должен ошибиться в одном и
    том же, чтобы это считалось пробелом, и за какое окно попыток это считается.
  kind: продуктовая
  owner: владелец продукта вместе с методистом
  jurisdiction: нет
  awaits: PRG
  breaks: >-
    Порог в один — случайная описка объявляется пробелом, и репетитор получает
    список из шума. Слишком высокий порог — настоящий пробел не всплывает
    вовсе. Окно меньше порога — набрать нужное число повторов невозможно
    в принципе.
  default: {"attempts": 3, "window": 10}
  schema:
    type: object
    additionalProperties: false
    required: [attempts, window]
    properties:
      attempts:
        description: сколько ошибок в одном и том же считается пробелом
        type: integer
        minimum: 2
        maximum: 20
      window:
        description: за сколько последних попыток они считаются
        type: integer
        minimum: 2
        maximum: 100

PDR_INTEGRATIONS:
  description: >-
    Включённые внешние интеграции: ключ словаря — имя интеграции из
    docs/architecture/integrations.md, значение — включена ли она. Отключение
    внешнего сервиса это снятый флаг, а не правка кода и не выкатка.
  kind: техническая
  owner: тот, кто держит сервис, вместе с владельцем продукта
  jurisdiction: нет
  awaits: ARCH
  breaks: >-
    Интеграции, которой нет в словаре, для механизма не существует, и это
    осознанное умолчание: забытый флаг означает выключённое украшение, а не
    молчаливое обращение наружу. Включённая интеграция, за которой нет живого
    адаптера, ходит в никуда на каждом сценарии — поэтому имя ключа сверяется
    с реестром интеграций (scripts/check_integrations.py).
  default: {}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          description: ходить ли наружу за этой функцией
          type: boolean
