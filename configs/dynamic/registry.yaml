# Реестр динамических значений ПДР.
#
# Число, влияющее на людей, живёт здесь, а не в константе: данных для его
# обоснования нет и год не будет, значит оно будет меняться — и ни одно
# изменение не должно требовать передеплоя.
#
# Механизм — ШТАТНЫЙ dynamic_config userver. Этот файл не читается сервисом: он
# реестр, а не источник. Значения по умолчанию живут в коде (dynamic_config::Key),
# и сервис поднимается на них, даже если источник конфигов недоступен. Реестр
# отвечает на другие вопросы: что это за величина, в каких пределах она
# осмысленна, что сломается за пределами и с кем разговаривать.
#
# Расхождение реестра с кодом роняет сборку: scripts/check_dynamic_configs.py
# сверяет имена, типы и значения по умолчанию в обе стороны.
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ каждой записи:
#   description   что это и на что влияет, словами для человека
#   kind          техническая | продуктовая
#   owner         кто решает, каким должно быть значение
#   jurisdiction  привязано ли значение к стране по существу: да | нет
#   breaks        что сломается, если выйти за пределы
#   default       значение по умолчанию — ровно то же, что объявлено в коде
#   schema        JSON-схема с пределами: minimum и maximum обязательны у чисел
#
# ПРО ЮРИСДИКЦИЮ. Сегодня рынок один — российский, и георазбивки нет ни в
# схеме, ни в коде. Пометка нужна не для неё: часть значений привязана к стране
# по существу (возрастные пороги самостоятельности, окна отмены, всё про чеки и
# налоговый статус, состав согласий). Пометка стоит копейки сейчас и превращает
# будущий выход в другую страну из ревизии всего продукта в разбор списка
# помеченных строк. Останется один рынок — пометка просто не пригодится.
#
# ПРО ВИД. Продуктовые значения правятся без участия разработчика — в этом и
# смысл задачи. Технические (таймауты, размеры пулов, сроки блокировок) правит
# тот, кто держит сервис.

PDR_PERIODIC_JOBS:
  description: >-
    Одиночные периодические задания: под каким именем задание берёт блокировку,
    как часто просыпается, сколько отведено одному прогону и после какого
    молчания оно считается замолчавшим. Ключ словаря — имя компонента задания.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    period_ms меньше attempt_ms — прогоны наезжают друг на друга и второй
    начинается, пока первый не отпустил блокировку. silence_allowed_ms меньше
    period_ms — тревога о молчании срабатывает на каждом прогоне, и через неделю
    на метрику перестают смотреть. Значения проверяются доменом
    (jobs::JobSettings::Compose): негодная запись отвергается целиком, старая
    продолжает действовать.
  default: {}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [lock, period_ms, attempt_ms, silence_allowed_ms, enabled]
      properties:
        lock:
          description: имя строки блокировки в jobs_lock
          type: string
          pattern: '^[a-z][a-z0-9._-]*[a-z0-9]$'
          maxLength: 64
        period_ms:
          description: как часто задание просыпается
          type: integer
          minimum: 1000
          maximum: 86400000
        attempt_ms:
          description: сколько отведено одному прогону, он же срок блокировки
          type: integer
          minimum: 100
          maximum: 86400000
        silence_allowed_ms:
          description: после какого молчания задание считается замолчавшим
          type: integer
          minimum: 1000
          maximum: 604800000
        enabled:
          description: выключенное задание блокировку не берёт вовсе
          type: boolean
