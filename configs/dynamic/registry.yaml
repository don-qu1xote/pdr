# Реестр динамических значений ПДР.
#
# Число, влияющее на людей, живёт здесь, а не в константе: данных для его
# обоснования нет и год не будет, значит оно будет меняться — и ни одно
# изменение не должно требовать передеплоя.
#
# Механизм — ШТАТНЫЙ dynamic_config userver. Этот файл не читается сервисом на
# ходу: он реестр, а не источник. Реестр отвечает на вопросы, которых в коде не
# видно: что это за величина, в каких пределах она осмысленна, что сломается за
# пределами и с кем разговаривать.
#
# ЭТОТ ФАЙЛ — ИСТОЧНИК ТИПОВ (PDR-ARCH-09). Структуры, разборщики, объекты
# dynamic_config::Key, умолчания и пределы порождает из него штатный chaotic на
# этапе сборки; в дереве не написано ни одной такой структуры руками. Отсюда
# два следствия, и оба важнее любой проверки:
#
#   * расхождение схемы и кода невыразимо. Поля, которого нет в схеме, нет и в
#     структуре — обращение к нему не компилируется. Правка схемы без правки
#     кода роняет СБОРКУ, а не проверочный скрипт;
#   * умолчание в коде и есть умолчание отсюда. Сверять их больше не с чем, и
#     проверка на это снята (scripts/check_dynamic_configs.py, «что убрано»).
#
# ЧТО ПОРОЖДАЕТСЯ, А ЧТО НЕТ. Порождаются записи БЕЗ поля «awaits»: величина с
# «awaits» решена, но кода, который её читает, ещё нет, и заводить ей ключ рано.
# Раскладку реестра по файлам штатного порождения делает
# scripts/dynamic_config_schemas.py — он ничего не пишет на C++, он режет этот
# файл по записям.
#
# «x-usrv-cpp-type» В СХЕМЕ — не украшение и не утечка кода в конфиг. Он говорит
# порождению, каким доменным типом становится запись, и нужен там, где у типа
# есть правило, схемой не выразимое (сегодня это одна запись — настройки
# задания). Сопряжение лежит рядом с типом, а не рядом со схемой.
#
# Расхождение реестра с кодом ловит scripts/check_dynamic_configs.py: он сверяет,
# что каждую записанную величину кто-то читает, а каждую читаемую — записали.
#
# ЧЕГО СХЕМА НЕ ЛОВИТ. Пределы одной колонки схема задаёт, а связь между двумя —
# нет: «окно меньше порога» и «период меньше отведённого на прогон» из неё не
# выражаются. Такие правила проверяет домен при разборе значения (например
# jobs::JobSettings::Compose), и негодная запись отвергается целиком — старое
# значение продолжает действовать. Это проверено: см. цель pdr_adapter_tests.
#
# ОБЯЗАТЕЛЬНЫЕ ПОЛЯ каждой записи:
#   description   что это и на что влияет, словами для человека
#   kind          техническая | продуктовая
#   owner         кто решает, каким должно быть значение
#   jurisdiction  привязано ли значение к стране по существу: да | нет
#   breaks        что сломается, если выйти за пределы
#   default       значение по умолчанию — ровно то же, что объявлено в коде
#   schema        JSON-схема с пределами: minimum и maximum обязательны у чисел
#
# НЕОБЯЗАТЕЛЬНОЕ ПОЛЕ:
#   awaits        область задачи, которая заведёт ключ в коде: величина решена в
#                 фазе 0, а кода, который её читает, ещё нет
#
# ПРО «awaits». Смысл задачи в том, чтобы число попало сюда РАНЬШЕ, чем зашьётся
# в код константой. Поэтому запись без ключа разрешена — но только с именем
# области, которая ключ заведёт, и область сверяется с закрытым списком в
# CONTRIBUTING.md. Когда ключ появляется, поле снимается тем же изменением:
# проверка роняет сборку и на записи без ключа без «awaits», и на записи с
# «awaits» при уже объявленном ключе. Ждать вечно у записи не получится.
#
# Умолчание у ждущей записи — предложение, а не факт: сверять его пока не с чем.
# Как только ключ объявлен, проверка начинает требовать совпадения с кодом.
#
# ПРО ЮРИСДИКЦИЮ. Сегодня рынок один — российский, и георазбивки нет ни в
# схеме, ни в коде. Пометка нужна не для неё: часть значений привязана к стране
# по существу (возрастные пороги самостоятельности, окна отмены, всё про чеки и
# налоговый статус, состав согласий). Пометка стоит копейки сейчас и превращает
# будущий выход в другую страну из ревизии всего продукта в разбор списка
# помеченных строк. Останется один рынок — пометка просто не пригодится.
#
# ПРО ВИД. Продуктовые значения правятся без участия разработчика — в этом и
# смысл задачи. Технические (таймауты, размеры пулов, сроки блокировок) правит
# тот, кто держит сервис.

PDR_PERIODIC_JOBS:
  description: >-
    Одиночные периодические задания: под каким именем задание берёт блокировку,
    как часто просыпается, сколько отведено одному прогону и после какого
    молчания оно считается замолчавшим. Ключ словаря — имя компонента задания.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    period_ms меньше attempt_ms — прогоны наезжают друг на друга и второй
    начинается, пока первый не отпустил блокировку. silence_allowed_ms меньше
    period_ms — тревога о молчании срабатывает на каждом прогоне, и через неделю
    на метрику перестают смотреть. Значения проверяются доменом
    (jobs::JobSettings::Compose): негодная запись отвергается целиком, старая
    продолжает действовать.
  default: {}
  schema:
    type: object
    additionalProperties:
      type: object
      x-usrv-cpp-type: pdr::jobs::JobSettings
      additionalProperties: false
      required: [lock, period_ms, attempt_ms, silence_allowed_ms, enabled]
      properties:
        lock:
          description: имя строки блокировки в jobs_lock
          type: string
          pattern: '^[a-z][a-z0-9._-]*[a-z0-9]$'
          maxLength: 64
        period_ms:
          description: как часто задание просыпается
          type: integer
          minimum: 1000
          maximum: 86400000
        attempt_ms:
          description: сколько отведено одному прогону, он же срок блокировки
          type: integer
          minimum: 100
          maximum: 86400000
        silence_allowed_ms:
          description: после какого молчания задание считается замолчавшим
          type: integer
          minimum: 1000
          maximum: 604800000
        enabled:
          description: выключенное задание блокировку не берёт вовсе
          type: boolean

PDR_SELF_ACCOUNT_AGE:
  description: >-
    С какого возраста ученик действует сам в первом круге дел: двигает свои
    занятия, пишет отзывы и распоряжается доступом своего опекуна. С него же
    конспекты и записи занятий переходят к нему. Ниже порога всё это делает
    опекун.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  breaks: >-
    Порог ниже установленного законом — платформа обрабатывает данные ребёнка
    без законного представителя. Порог выше — взрослый самостоятельный ученик
    (языки, подготовка в вуз) не может завести себе занятие и упирается в
    требование опекуна, которого у него нет.
  default: 14
  schema:
    type: integer
    minimum: 6
    maximum: 21

PDR_OWN_PAYMENTS_AGE:
  description: >-
    С какого возраста ученик платит СВОИМИ средствами и сам выбирает репетитора.
    Автоплатёж с карты опекуна этим порогом НЕ открывается ни в каком возрасте:
    деньги на ней чужие, и распоряжается ими тот, чья карта.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  breaks: >-
    Порог ниже установленного законом — подросток совершает сделки, которые
    закон за ним не признаёт, и платёж оспаривается задним числом. Порог выше —
    работающий шестнадцатилетний не может оплатить занятие со своей карты и
    каждый раз идёт к родителю.
  default: 16
  schema:
    type: integer
    minimum: 6
    maximum: 21

PDR_MAJORITY_AGE:
  description: >-
    Возраст полной дееспособности. С него у опекуна кончаются ПОСЛЕДНИЕ уровни
    доступа — расписание и деньги; конспекты и записи занятий переходят к
    ученику раньше, на пороге PDR_SELF_ACCOUNT_AGE.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  breaks: >-
    Порог ниже установленного законом — платформа считает взрослым того, кто им
    не является, и снимает с родителя доступ, который тот обязан иметь. Порог
    выше — совершеннолетний человек не может закрыть родителю доступ к своей
    учёбе.
  default: 18
  schema:
    type: integer
    minimum: 6
    maximum: 21

PDR_REQUIRED_CONSENTS:
  description: >-
    Какие согласия обязательны до первого занятия: обработка данных, запись
    занятия, передача данных опекуну. Список, а не флаги: состав меняется вместе
    с законом, а не вместе с релизом.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  awaits: IDENT
  breaks: >-
    Недостающее согласие — обработка данных без основания. Лишнее — человек
    подписывает то, чего продукт не делает, и перестаёт читать любые согласия.
  default: ["personal_data", "lesson_recording"]
  schema:
    type: array
    items:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      maxLength: 64

PDR_BOOKING_WINDOWS:
  description: >-
    Окна бронирования: за сколько до занятия его ещё можно записать и до какого
    момента отменить без удержания. Часы, потому что человек думает в часах.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: да
  awaits: SCHED
  breaks: >-
    Окно записи слишком короткое — ученик не может записаться на завтра, и
    расписание пустует при живом спросе. Окно отмены слишком длинное — репетитор
    теряет оплаченное время без возможности его продать; слишком короткое —
    ученик платит за занятие, которое отменил заранее, и это спор, который
    решает не платформа, а закон.
  default: {"booking_before_hours": 2, "free_cancel_before_hours": 24}
  schema:
    type: object
    additionalProperties: false
    required: [booking_before_hours, free_cancel_before_hours]
    properties:
      booking_before_hours:
        description: за сколько часов до начала занятие ещё можно записать
        type: integer
        minimum: 0
        maximum: 168
      free_cancel_before_hours:
        description: до какого момента отмена бесплатна
        type: integer
        minimum: 0
        maximum: 336

PDR_LESSONS_PER_DAY_LIMIT:
  description: >-
    Сколько занятий в день платформа позволяет назначить одному ученику. Не
    техническое ограничение, а забота: подряд поставленные занятия перестают
    учить.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: да
  awaits: SCHED
  breaks: >-
    Ноль — записаться нельзя вовсе. Слишком много — платформа помогает
    поставить ребёнку шесть занятий подряд и отвечает за последствия; учебная
    нагрузка несовершеннолетних ограничена санитарными нормами, и нормы эти у
    каждой страны свои.
  default: 4
  schema:
    type: integer
    minimum: 1
    maximum: 12

PDR_SCHEDULE_HORIZON:
  description: >-
    Горизонт расписания: на сколько дней вперёд открыты слоты и как часто
    механизм пересматривает горизонт, продлевая его.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: SCHED
  breaks: >-
    Горизонт короче периода пересмотра — слоты кончаются раньше, чем механизм
    просыпается их продлить, и ученик видит пустое расписание. Слишком длинный
    горизонт — репетитор обязуется на полгода вперёд и потом отменяет.
  default: {"open_days": 30, "review_period_hours": 24}
  schema:
    type: object
    additionalProperties: false
    required: [open_days, review_period_hours]
    properties:
      open_days:
        description: на сколько дней вперёд открыты слоты
        type: integer
        minimum: 1
        maximum: 365
      review_period_hours:
        description: как часто пересматривается горизонт
        type: integer
        minimum: 1
        maximum: 168

PDR_AUTOCHARGE_OBJECTION_WINDOW:
  description: >-
    Сколько часов после уведомления об автосписании у плательщика есть, чтобы
    возразить, — до того как деньги спишутся.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  awaits: BILL
  breaks: >-
    Ноль — деньги списываются без возможности возразить, и это не «удобно», а
    претензия. Слишком большое окно — репетитор ждёт оплаты неделю после
    занятия. Правила уведомления о списании и срок возражения задаёт закон о
    правах потребителя, а он свой в каждой стране.
  default: 48
  schema:
    type: integer
    minimum: 1
    maximum: 336

PDR_RECEIPT_DEADLINE:
  description: >-
    Сколько часов отведено на выдачу чека после того, как платёж прошёл, и
    сколько раз механизм повторяет попытку, если чек не выдался.
  kind: продуктовая
  owner: владелец продукта вместе с бухгалтером
  jurisdiction: да
  awaits: BILL
  breaks: >-
    Срок больше законного — чек выдан с опозданием, и отвечает за это репетитор
    как самозанятый. Ноль повторов — единственный сбой оператора оставляет
    платёж без чека, и никто об этом не узнает. Сроки выдачи чека и налоговый
    статус продавца — целиком вопрос страны.
  default: {"deadline_hours": 24, "retries": 5}
  schema:
    type: object
    additionalProperties: false
    required: [deadline_hours, retries]
    properties:
      deadline_hours:
        description: за сколько часов чек обязан быть выдан
        type: integer
        minimum: 1
        maximum: 168
      retries:
        description: сколько раз повторить попытку выдачи
        type: integer
        minimum: 0
        maximum: 20

PDR_REPUTATION_PRIOR:
  description: >-
    Сила априора в репутации репетитора: сколько условных средних отзывов
    подмешивается к настоящим, пока их мало. Новичок с одной пятёркой не должен
    обгонять репетитора с сотней четвёрок.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: REP
  breaks: >-
    Ноль — первая же оценка задирает или топит репетитора целиком, и подбор
    начинает выдавать случайных людей. Слишком много — сто настоящих отзывов не
    сдвигают оценку, и репутация перестаёт что-либо значить.
  default: 10
  schema:
    type: integer
    minimum: 0
    maximum: 200

PDR_REVIEW_PUBLICATION:
  description: >-
    Порог публикации отзыва: сколько отзывов должно накопиться у репетитора,
    прежде чем они станут видны, и сколько часов отзыв ждёт до публикации.
    Задержка — чтобы отзыв нельзя было связать с конкретным занятием.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: REP
  breaks: >-
    Порог в один отзыв — первый же недовольный виден всем и виден один. Слишком
    высокий порог — отзывы копятся годами и не публикуются никогда. Нулевая
    задержка — ученик узнаваем по времени занятия, и честного отзыва больше не
    будет.
  default: {"min_reviews": 3, "delay_hours": 72}
  schema:
    type: object
    additionalProperties: false
    required: [min_reviews, delay_hours]
    properties:
      min_reviews:
        description: сколько отзывов нужно, чтобы они стали видны
        type: integer
        minimum: 1
        maximum: 50
      delay_hours:
        description: сколько часов отзыв ждёт до публикации
        type: integer
        minimum: 0
        maximum: 720

PDR_MATCHING_NEWCOMER_SHARE:
  description: >-
    Какая доля выдачи подбора отводится репетиторам без отзывов. В процентах,
    целым числом: доля дробным числом от нуля до единицы читается на глаз
    неверно ровно один раз, и этого хватает.
  kind: продуктовая
  owner: владелец продукта
  jurisdiction: нет
  awaits: MATCH
  breaks: >-
    Ноль — новичок не получает ни одного показа, отзывов у него не появится
    никогда, и подбор навсегда закрыт для новых репетиторов. Сто — выдача
    состоит из людей, о которых ничего не известно, и ученик уходит.
  default: 20
  schema:
    type: integer
    minimum: 0
    maximum: 100

PDR_REPEATED_MISTAKE:
  description: >-
    Порог повторяющейся ошибки: сколько раз ученик должен ошибиться в одном и
    том же, чтобы это считалось пробелом, и за какое окно попыток это считается.
  kind: продуктовая
  owner: владелец продукта вместе с методистом
  jurisdiction: нет
  awaits: PRG
  breaks: >-
    Порог в один — случайная описка объявляется пробелом, и репетитор получает
    список из шума. Слишком высокий порог — настоящий пробел не всплывает
    вовсе. Окно меньше порога — набрать нужное число повторов невозможно
    в принципе.
  default: {"attempts": 3, "window": 10}
  schema:
    type: object
    additionalProperties: false
    required: [attempts, window]
    properties:
      attempts:
        description: сколько ошибок в одном и том же считается пробелом
        type: integer
        minimum: 2
        maximum: 20
      window:
        description: за сколько последних попыток они считаются
        type: integer
        minimum: 2
        maximum: 100

PDR_INTEGRATIONS:
  description: >-
    Включённые внешние интеграции: ключ словаря — имя интеграции из
    docs/architecture/integrations.md, значение — включена ли она. Отключение
    внешнего сервиса это снятый флаг, а не правка кода и не выкатка.
  kind: техническая
  owner: тот, кто держит сервис, вместе с владельцем продукта
  jurisdiction: нет
  awaits: ARCH
  breaks: >-
    Интеграции, которой нет в словаре, для механизма не существует, и это
    осознанное умолчание: забытый флаг означает выключённое украшение, а не
    молчаливое обращение наружу. Включённая интеграция, за которой нет живого
    адаптера, ходит в никуда на каждом сценарии — поэтому имя ключа сверяется
    с реестром интеграций (scripts/check_integrations.py).
  default: {}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          description: ходить ли наружу за этой функцией
          type: boolean

PDR_AI_NODES:
  description: >-
    Чем считает каждый ИИ-узел: своей моделью или внешним провайдером. Ключ
    словаря — имя узла из docs/architecture/ai-sovereignty.md. Рядом с выбором
    живёт external_min_gain: насколько внешняя обязана быть лучше своей, чтобы
    её стоило включать. Решение принимается числом с фиксированного набора
    (scripts/compare_quality.py), а не ощущением от пяти примеров.
  kind: продуктовая
  owner: владелец продукта вместе с тем, кто держит железо
  jurisdiction: нет
  awaits: ARCH
  breaks: >-
    implementation external у узла, у которого нет своей реализации, — это
    единственная законная зависимость (handwriting). У остальных external по
    умолчанию означает, что своя реализация проверяется только в день отказа
    провайдера, то есть не проверяется (ADR-0015); умолчания сверяются с
    таблицей узлов проверкой scripts/check_sovereignty.py. external_min_gain
    ноль означает «включаем внешнюю при любом выигрыше», в том числе при
    выигрыше в пределах погрешности набора; единица означает «не включаем
    никогда».
  default: {"transcription_final": {"implementation": "own", "external_min_gain": 0.15}, "transcription_live": {"implementation": "own", "external_min_gain": 0.2}, "embeddings": {"implementation": "own", "external_min_gain": 0.1}, "text_generation": {"implementation": "own", "external_min_gain": 0.25}, "handwriting": {"implementation": "external", "external_min_gain": 0.0}}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [implementation, external_min_gain]
      properties:
        implementation:
          description: чем считает узел прямо сейчас
          type: string
          enum: [own, external]
        external_min_gain:
          description: доля, на которую внешняя обязана быть лучше своей
          type: number
          minimum: 0.0
          maximum: 1.0

PDR_IDEMPOTENCY:
  description: >-
    Сколько часов ключ повтора защищает от второго выполнения операции. Клиент,
    у которого оборвалась связь, повторяет запрос с тем же ключом — и в течение
    этого срока получает сохранённый ответ, а не второе занятие и не второе
    списание (docs/architecture/idempotency.md). После срока тот же ключ
    считается новым намерением, а не повтором.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Срок в минуты означает, что клиент с оборванной связью и разумной паузой
    перед повтором выполнит операцию второй раз: ключ к этому моменту уже
    просрочен, и защиты нет вовсе. Срок в месяцы держит в таблице ответы на
    запросы, о которых никто уже не помнит, — и человек, намеренно повторивший
    то же действие через неделю, получает старый ответ вместо нового занятия.
  default: {"lifetime_hours": 24}
  schema:
    type: object
    additionalProperties: false
    required: [lifetime_hours]
    properties:
      lifetime_hours:
        description: сколько часов ключ защищает от повтора
        type: integer
        minimum: 1
        maximum: 720

PDR_PRODUCT_EVENTS:
  description: >-
    Продуктовый поток: сколько дней хранить записи и писать ли поток вообще.
    Величина техническая — она меняет не поведение продукта, а размер таблицы
    и то, останется ли к моменту вопроса на что смотреть
    (docs/architecture/product-events.md). Уборка идёт по recorded_at, а не по
    occurred_at: событие с уехавшим временем издателя не должно ни выживать
    вечно, ни исчезать раньше остальных.
  kind: техническая
  owner: тот, кто держит сервис, вместе с владельцем продукта
  jurisdiction: нет
  breaks: >-
    Срок в недели стирает ответ раньше, чем вопрос успевают задать: откат
    самостоятельности измеряется месяцами, инфляция оценок — годами, а
    исторических данных задним числом не появится. Срок в десятилетия — это
    обезличенный, но всё ещё растущий вечно поток. Enabled false останавливает
    запись целиком: вопросы из docs/product/open-questions.md перестают
    закрываться молча, поэтому выключение — это решение, а не настройка по
    умолчанию.
  default: {"enabled": true, "retention_days": 730}
  schema:
    type: object
    additionalProperties: false
    required: [enabled, retention_days]
    properties:
      enabled:
        description: писать ли продуктовые события
        type: boolean
      retention_days:
        description: сколько дней запись живёт с момента попадания в таблицу
        type: integer
        minimum: 30
        maximum: 3650

PDR_SIGN_IN_RULES:
  description: >-
    Как считается хеш пароля и какой пароль вообще принимается: память, проходы
    и нити Argon2id плюс наименьшая длина. Стоимость счёта подбирают под живое
    железо — столько, чтобы вход занимал заметное, но терпимое время.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Память или проходы ниже рекомендованных — перебор украденной базы паролей
    становится дешёвым, и никто об этом не узнает. Слишком большие — вход
    занимает секунды, а одновременных входов бывает много, и сервис ложится сам
    от собственной защиты. Нити выше памяти Argon2 не принимает вовсе; нижние
    пределы и связь между величинами проверяет домен
    (identity::PasswordRules::Compose), негодная запись отвергается целиком.
    Порог длины ниже восьми знаков означает пароль, который перебирается
    целиком независимо от стоимости счёта.
  default: {"memory_kib": 19456, "iterations": 2, "parallelism": 1, "min_length": 10}
  schema:
    type: object
    additionalProperties: false
    required: [memory_kib, iterations, parallelism, min_length]
    properties:
      memory_kib:
        description: сколько памяти занимает один счёт хеша
        type: integer
        minimum: 19456
        maximum: 1048576
      iterations:
        description: сколько проходов по этой памяти
        type: integer
        minimum: 2
        maximum: 20
      parallelism:
        description: во сколько нитей идёт счёт
        type: integer
        minimum: 1
        maximum: 16
      min_length:
        description: сколько знаков должно быть в новом пароле
        type: integer
        minimum: 8
        maximum: 256

PDR_LOGIN_THROTTLE:
  description: >-
    Сколько неудачных попыток входа и за какое окно считается перебором.
    Считается отдельно по учётной записи и по адресу: одно без другого не
    закрывает ни перебора списка учеников с одной машины, ни подбора пароля к
    одной записи из ботнета.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Порог по записи слишком низкий — человек, дважды ошибшийся в раскладке,
    заперт, а звонить ему некому. Слишком высокий — перебор идёт свободно.
    Порог по адресу ниже порога по записи запирает целый класс из школы, у
    которого один адрес на всех; это отвергает домен
    (identity::ThrottleLimits::Compose). Окно в минуту снимает запрет раньше,
    чем человек успевает заметить, что он заперт.
  default: {"window_minutes": 15, "per_account": 10, "per_address": 50}
  schema:
    type: object
    additionalProperties: false
    required: [window_minutes, per_account, per_address]
    properties:
      window_minutes:
        description: за сколько минут считаются попытки
        type: integer
        minimum: 1
        maximum: 1440
      per_account:
        description: сколько неудач по одной учётной записи запирают вход
        type: integer
        minimum: 1
        maximum: 1000
      per_address:
        description: сколько неудач с одного адреса запирают вход
        type: integer
        minimum: 1
        maximum: 10000

PDR_SIGNUP_THROTTLE:
  description: >-
    Сколько самостоятельных заведений с одного адреса и за какое окно считается
    перебором. Стоит только на самостоятельной регистрации: приглашение выдаёт
    репетитор в своей практике, и ограничивать его там незачем.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Порог слишком низкий — семья с одного домашнего адреса не может завести
    вторую учётную запись, и родитель после ребёнка упирается в отказ. Слишком
    высокий — заведение тысячи пустых записей ничего не стоит, а разбирать их
    придётся руками. Ноль запрещает регистрацию вовсе, и это отвергает домен
    (identity::SignupLimits::Compose).
  default: {"window_minutes": 60, "per_address": 5}
  schema:
    type: object
    additionalProperties: false
    required: [window_minutes, per_address]
    properties:
      window_minutes:
        description: за сколько минут считаются заведения
        type: integer
        minimum: 1
        maximum: 1440
      per_address:
        description: сколько заведений с одного адреса запирают регистрацию
        type: integer
        minimum: 1
        maximum: 100

PDR_AUTH_LIFETIMES:
  description: >-
    Сколько живут сессия, приглашение и ссылка сброса пароля. Три разных срока,
    потому что риск у них разный: сессию можно отозвать, одноразовую ссылку —
    уже нет, она либо сработает, либо истечёт.
  kind: техническая
  owner: тот, кто держит сервис, вместе с владельцем продукта
  jurisdiction: нет
  breaks: >-
    Сессия в час превращает продукт в форму входа: репетитор ведёт занятие и
    входит заново посреди него. Сессия в годы означает, что унесённый ноутбук
    открыт до тех пор, пока кто-нибудь не спохватится. Приглашение в час не
    доживает до вечера, когда родитель открывает почту. Ссылка сброса,
    живущая дольше приглашения, — самая опасная строка в системе, и это
    отвергает домен (identity::AuthLifetimes::Compose).
  default: {"session_hours": 720, "invitation_hours": 168, "password_reset_minutes": 30}
  schema:
    type: object
    additionalProperties: false
    required: [session_hours, invitation_hours, password_reset_minutes]
    properties:
      session_hours:
        description: сколько часов живёт сессия, если её не отозвали
        type: integer
        minimum: 1
        maximum: 8760
      invitation_hours:
        description: сколько часов действует приглашение
        type: integer
        minimum: 1
        maximum: 720
      password_reset_minutes:
        description: сколько минут действует ссылка сброса пароля
        type: integer
        minimum: 5
        maximum: 1440

PDR_GUARDIAN_HANDOVER_DAYS:
  description: >-
    Сколько дней даётся семье на решение, когда ученик достигает возраста
    самостоятельности. Всё это время доступ опекуна к конспектам и записям
    занятий работает по-прежнему; после — закрывается, пока ученик не откроет
    его сам.
  kind: продуктовая
  owner: владелец продукта вместе с юристом
  jurisdiction: да
  breaks: >-
    Ноль дней — это мгновенный обрыв в день рождения: родитель перестаёт видеть
    занятия, за которые платит, посреди учебного года, и виноватой оказывается
    платформа. Такое значение отвергает домен
    (identity::MaturityRule::Compose). Слишком долгий срок означает, что
    взрослый человек полгода не может закрыть чужой доступ к своим записям, — а
    с момента совершеннолетия это уже его решение и ничьё больше.
  default: 30
  schema:
    type: integer
    minimum: 1
    maximum: 180

POSTGRES_DEFAULT_COMMAND_CONTROL:
  description: >-
    Сколько времени отведено запросу к базе, у которого нет своего срока. Пол,
    ниже которого не проваливается ни один запрос: `network_timeout_ms` — весь
    поход драйвера, `statement_timeout_ms` — сколько считает сама база.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Без значения таймаута нет вовсе: зависший запрос держит транзакцию
    арендатора, занятый ключ повтора и соединение из пула, и пул кончается
    раньше, чем кто-то заметит. Снаружи это «всё висит», а не ошибка. Слишком
    малое значение рвёт нормальные запросы на медленном железе и выглядит как
    случайные пятисотые.
  штатная: да
  default: {"network_timeout_ms": 2000, "statement_timeout_ms": 1500}
  schema:
    type: object
    additionalProperties: false
    required: [network_timeout_ms, statement_timeout_ms]
    properties:
      network_timeout_ms:
        description: весь поход драйвера, включая ожидание соединения
        type: integer
        minimum: 100
        maximum: 60000
      statement_timeout_ms:
        description: сколько считает сама база; всегда меньше сетевого
        type: integer
        minimum: 50
        maximum: 60000

POSTGRES_QUERIES_COMMAND_CONTROL:
  description: >-
    Срок ОТДЕЛЬНОГО запроса, по его имени. Имена стоят у всех запросов дерева
    (`Query::Name`), и здесь названы те, которым общий пол не подходит:
    задания и уборка живут дольше, вход и опознание обязаны отвечать быстрее.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Имя, которого в дереве нет, — это срок, который никому не достался: запрос
    молча остаётся на общем поле. Переименовали запрос и забыли строку здесь —
    то же самое. Расхождение ловит scripts/check_query_timeouts.py.
  штатная: да
  default:
    identity_session_find: {"network_timeout_ms": 500, "statement_timeout_ms": 400}
    identity_credential_by_email: {"network_timeout_ms": 500, "statement_timeout_ms": 400}
    identity_login_attempt_seen: {"network_timeout_ms": 500, "statement_timeout_ms": 400}
    identity_login_attempt_register: {"network_timeout_ms": 500, "statement_timeout_ms": 400}
    identity_session_save: {"network_timeout_ms": 800, "statement_timeout_ms": 600}
    declare_tenant: {"network_timeout_ms": 300, "statement_timeout_ms": 200}
    http_idempotency_key_claim: {"network_timeout_ms": 800, "statement_timeout_ms": 600}
    http_idempotency_key_complete: {"network_timeout_ms": 800, "statement_timeout_ms": 600}
    readiness_applied_migrations: {"network_timeout_ms": 1000, "statement_timeout_ms": 800}
    jobs_claim_effect: {"network_timeout_ms": 10000, "statement_timeout_ms": 9000}
    jobs_run_started: {"network_timeout_ms": 10000, "statement_timeout_ms": 9000}
    jobs_run_finished: {"network_timeout_ms": 10000, "statement_timeout_ms": 9000}
    jobs_run_last: {"network_timeout_ms": 10000, "statement_timeout_ms": 9000}
    identity_session_revoke_all: {"network_timeout_ms": 10000, "statement_timeout_ms": 9000}
    observability_product_event_record: {"network_timeout_ms": 3000, "statement_timeout_ms": 2500}
  schema:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [network_timeout_ms, statement_timeout_ms]
      properties:
        network_timeout_ms:
          description: весь поход драйвера для запроса с этим именем
          type: integer
          minimum: 100
          maximum: 60000
        statement_timeout_ms:
          description: сколько считает база; всегда меньше сетевого
          type: integer
          minimum: 50
          maximum: 60000

USERVER_DEADLINE_PROPAGATION_ENABLED:
  description: >-
    Доходит ли до работы срок, который назначил клиент (`X-YaTaxi-Client-TimeoutMs`).
    Включено — остаток времени едет в запросы к базе сам; выключено — сервис
    доделывает работу, которую уже никто не ждёт.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Выключенным оно не экономит, а копит: под перегрузкой очередь работы, чей
    заказчик давно ушёл, добивает сервис окончательно. Включённым — обрывает
    запрос, который клиент всё равно бы не дождался.
  штатная: да
  default: true
  schema:
    type: boolean

USERVER_CANCEL_HANDLE_REQUEST_BY_DEADLINE:
  description: >-
    Обрывать ли работу, у которой срок вышел ПОСРЕДИ выполнения. Без этого
    просроченный запрос узнаёт о своём сроке только на границе, а между границами
    доделывает всё до конца.
  kind: техническая
  owner: тот, кто держит сервис
  jurisdiction: нет
  breaks: >-
    Выключенным превращает срок в пожелание: транзакция арендатора живёт до
    конца работы, которую уже не ждут. Включённым обрывает работу на середине —
    поэтому всё, что меняет состояние, живёт в ОДНОЙ транзакции и откатывается
    целиком (docs/architecture/http.md).
  штатная: да
  default: true
  schema:
    type: boolean
